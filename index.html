груша, цедра, цветы — для новичков."]]}]}, {"id": "regions", "title": "Регионы", "blocks": [{"type": "h", "text": "Шотландия: пять регионов"}, {"type": "p", "text": "В традиционной классификации Scotch Whisky выделяют пять регионов: Speyside, Highland, Islay, Lowland и Campbeltown."}, {"type": "note", "text": "Острова, кроме Islay, не образуют отдельный шестой официальный регион."}, {"type": "cards", "items": [["Speyside · Спейсайд", "Долина реки Спей", "Яблоко, груша, мёд, ваниль, солод, сухофрукты; многие используют хересные бочки. Примеры: The Macallan, Glenfiddich, The Glenlivet. Гостю: фруктовый, медовый, мягкий или насыщенный дубовый стиль — зависит от бутылки."], ["Highland · Хайленд", "Север Шотландии", "Самый разнообразный регион: от лёгкого и цветочного до пряного, насыщенного и дымного; у прибрежных винокурен бывают солоноватые ноты. Примеры: Glenmorangie, Dalmore, Oban. Гостю: если хочется исследовать разные стили Scotch."], ["Islay · Айла", "Остров на западе", "Торфяной дым, копчёность, земля, иногда йод и море. Но не весь виски Айлы одинаково дымный. Примеры: Laphroaig, Ardbeg, Bowmore. Гостю: дым и костёр, но сначала уточните, насколько интенсивный дым нравится."], ["Lowland · Лоуленд", "Юг Шотландии", "Традиционно лёгкие, травяные, зерновые и цветочные оттенки; современные стили разнообразнее. Примеры: Auchentoshan, Glenkinchie. Гостю: чтобы начать с менее дымных и более лёгких образцов."], ["Campbeltown · Кэмпбелтаун", "Полуостров Кинтайр", "Когда-то крупный центр, сейчас мало винокурен. Выразительные, иногда маслянистые, фруктовые, солоноватые, пряные и дымные профили. Примеры: Springbank, Glen Scotia, Kilkerran. Гостю: тем, кто знает основы Scotch и хочет менее массовое."]]}, {"type": "h", "text": "Ирландия"}, {"type": "p", "text": "Производится на всём острове — в Республике Ирландия и Северной Ирландии — по спецификации защищённого наименования. Исторически связан с перегонкой в медных кубах, сейчас методы разные."}, {"type": "cards", "items": [["Single Pot Still", "Пример: Redbreast", "Соложёный и несоложёный ячмень. Маслянистая текстура, пряность, яблоко, зерновые ноты."], ["Single Malt", "Пример: Bushmills", "Одна винокурня, соложёный ячмень. Фруктовый, медовый, цветочный или древесный."], ["Blended Irish", "Пример: Jameson", "Купаж разных типов. Часто мягкий зерновой, фруктовый, ванильный профиль."]]}, {"type": "note", "text": "Ирландский виски не обязательно тройной перегонки и не обязательно мягкий — это ассоциации, а не правила."}, {"type": "h", "text": "США"}, {"type": "p", "text": "Классификация строится на составе зерновой смеси и требованиях к производству. Кентукки тесно связан с бурбоном, но бурбон можно делать в любом штате."}, {"type": "cards", "items": [["Kentucky Bourbon", "Buffalo Trace, Maker’s Mark", "≥51% кукурузы, новые обожжённые дубовые бочки. Ваниль, карамель, дуб, сладкая кукуруза, специи."], ["Tennessee Whiskey", "Jack Daniel’s", "Производится в Теннесси. Для традиционных стилей характерна фильтрация через древесный уголь до выдержки — Lincoln County Process."], ["Rye Whiskey", "Rittenhouse Rye", "≥51% ржи. Пряный, суховатый, перечные и травяные оттенки."]]}, {"type": "h", "text": "Почему бурбон кажется слаще Scotch"}, {"type": "list", "items": ["Кукуруза даёт иной зерновой профиль, чем ячмень.", "Новая обожжённая бочка активно отдаёт ваниль, карамель и дерево.", "В Scotch часто используют бочки, уже бывшие в употреблении."]}, {"type": "note", "text": "Не весь бурбон сладкий и не весь Scotch сухой: торф, бочка, купаж и техника могут полностью изменить впечатление."}, {"type": "h", "text": "Канада"}, {"type": "p", "text": "Разнообразие зерновых рецептур и купажирование; рожь исторически важна. Но Canadian Rye Whisky не всегда означает, что ржи больше 51%, как в американском правиле. Выдержка в общем случае — от трёх лет в небольшой деревянной таре."}, {"type": "p", "text": "Во вкусе: зерновые и пряные ноты, карамель, ваниль, дерево, мягкий профиль купажа. Пример: Crown Royal."}, {"type": "h", "text": "Япония"}, {"type": "p", "text": "Сильное влияние шотландской школы, но своя культура производства и купажирования. Климат — от прохладных горных районов до регионов с выраженной сезонностью. Профили: от тонких фруктовых и цветочных до медовых, пряных, древесных и дымных. Примеры: Yamazaki, Hakushu, Nikka."}, {"type": "note", "text": "Стандарт Japan Spirits & Liqueurs Makers Association: японские сырьё и вода, производство, выдержка от 3 лет в бочках до 700 л и розлив в Японии. Проверяйте, соответствует ли ему конкретная бутылка."}, {"type": "h", "text": "Другие страны"}, {"type": "cards", "items": [["Индия", "Amrut, Paul John", "Жаркий климат ускоряет взаимодействие спирта с деревом. Тропические фрукты, специи, солод, насыщенная древесность."], ["Австралия", "Lark", "Особенно известна Тасмания. Разные зерновые рецепты и бочки: фруктовые, пряные, древесные профили."], ["Тайвань", "Kavalan", "Тёплый влажный климат влияет на созревание. Спелые фрукты, ваниль, специи, выраженная древесность."]]}, {"type": "p", "text": "У этих стран нет единого вкусового профиля: правила, климат и стили брендов различаются."}, {"type": "h", "text": "Шпаргалка по регионам"}, {"type": "table", "head": ["Регион", "Ассоциации", "Что предложить"], "rows": [["Speyside", "Фрукты, мёд, ваниль", "Начать с фруктового односолодового"], ["Islay", "Торф, дым, морские ноты", "Гостю, который любит дым"], ["Highland", "Очень разнообразный", "Исследовать стили Scotch"], ["Ирландия", "Фрукты, зерно, мягкие специи", "Знакомство с ирландскими стилями"], ["США, Bourbon", "Ваниль, карамель, обожжённый дуб", "Насыщенный сладковатый профиль"], ["США, Rye", "Перец, пряность, сухость", "Manhattan и Old Fashioned"], ["Канада", "Купаж, зерно, специи", "Универсальный виски для коктейлей"], ["Япония", "От фруктового до дымного", "Тонкие нюансы купажа"], ["Индия, Тайвань", "Яркие фрукты, древесность", "Сравнить влияние климата"]]}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "Лучше бокал-тюльпан: он концентрирует аромат."}, {"type": "olist", "items": ["Посмотреть: цвет и прозрачность (о возрасте не скажет).", "Понюхать: сначала издалека, потом ближе — фрукты, солод, ваниль, специи, дым.", "Небольшой глоток: сладость, кислотность, горечь, текстура, крепость.", "Послевкусие: короткое или долгое, пряное, древесное, дымное.", "Несколько капель воды по желанию — не всегда улучшает."]}, {"type": "h", "text": "Подобрать гостю"}, {"type": "table", "head": ["Гость любит", "Предложить"], "rows": [["Мягкий, сладковатый", "Фруктовый ирландский или бурбон"], ["Специи", "Ржаной виски"], ["Дым и яркий характер", "Торфяной Scotch"]]}, {"type": "note", "text": "Страна и категория подсказывают направление, но не гарантируют вкус — уточняйте предпочтения."}]}, {"id": "cocktails", "title": "Коктейли", "blocks": [{"type": "cocktails", "items": [["Old Fashioned", "Виски, сахар, биттер, лёд, цитрусовый аромат. Бурбон слаще, рай прянее."], ["Whiskey Sour", "Виски, лимон, сахарный сироп; по желанию белок для пены."], ["Manhattan", "Рай или бурбон, сладкий вермут, ароматический биттер."], ["Penicillin", "Шотландский виски, лимон, мёд, имбирь, немного дымного виски сверху."]]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "table", "head": ["Категория", "Главное", "Ассоциации"], "rows": [["Single Malt Scotch", "Солод, одна винокурня, pot still", "Фрукты, мёд, дым"], ["Blended Scotch", "Солодовые + зерновые", "Баланс, широкий диапазон"], ["Irish", "Несколько официальных типов", "Фруктовый, мягкий"], ["Bourbon", "США, ≥51% кукурузы, новые бочки", "Ваниль, карамель, дуб"], ["Rye", "≥51% ржи", "Перец, специи, сухость"], ["Canadian", "Широкий диапазон купажей", "От зернового до пряного"], ["Japanese", "Разнообразные стили", "От фруктового до дымного"]]}, {"type": "p", "text": "Ключевой навык бармена — понимать, почему два виски отличаются и какой подойдёт конкретному гостю или коктейлю."}]}], "cover": "img/mvxuni7n.jpg"}, {"id": "brandy", "num": "06", "name": "Коньяк и бренди", "en": "Cognac & Brandy", "tagline": "От винограда до бокала", "facts": [["Сырьё", "Виноград"], ["Коньяк", "Франция"], ["Классы", "VS · VSOP · XO"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Коньяк — разновидность бренди, но не каждый бренди — коньяк. Разница в происхождении, сырье, технологии и строгих правилах."}, {"type": "p", "text": "Бренди — группа напитков, получаемых дистилляцией вина или продуктов виноделия. Чаще всего виноградный, но бывают и фруктовые."}, {"type": "list", "items": ["Cognac — коньяк из определённого региона Франции", "Armagnac — другой французский виноградный дистиллят", "Brandy de Jerez — испанский бренди из Хереса", "Pisco — Перу и Чили, свои национальные правила"]}, {"type": "p", "text": "Вкус: виноград, цветы, яблоко, груша, ваниль, сухофрукты, орехи, карамель, специи; с дубом — древесные и окислительные оттенки."}, {"type": "note", "text": "Бренди не обязан быть старым, тёмным или сладким — всё зависит от стиля."}, {"type": "h", "text": "История"}, {"type": "p", "text": "Виноградный спирт было удобнее перевозить и хранить, чем вино. Регион Коньяк на западе Франции стал главным центром: двойная перегонка в медных кубах, выдержка в дубе, купаж спиртов разных лет. Арманьяк развивался иначе — с широким применением непрерывной перегонки."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "steps", "items": [["Виноград и вино", "Для коньяка чаще всего Ugni Blanc: кислое, лёгкое вино — основа для спирта, а не для питья."], ["Дистилляция", "Двойная перегонка в медных шарантских кубах: промежуточный спирт, затем отбор нужной фракции."], ["Выдержка", "Дубовые бочки и кислород дают ваниль, специи, сухофрукты, орехи."], ["Купажирование", "Мастер добивается баланса, а не просто смешивает самые старые спирты."]]}, {"type": "note", "text": "Арманьяк часто перегоняют однократно в непрерывном аппарате, Brandy de Jerez выдерживают в бочках из-под хереса по системе criaderas y solera."}]}, {"id": "cognac", "title": "Коньяк", "blocks": [{"type": "p", "text": "Cognac — защищённое географическое наименование: сырьё, производство, перегонка и выдержка регулируются спецификацией."}, {"type": "h", "text": "Шесть крю"}, {"type": "cards", "items": [["Grande Champagne", "Крю", "Тонкие, сложные спирты, хорошо развиваются при долгой выдержке."], ["Petite Champagne", "Крю", "Разнообразные спирты; с Grande Champagne — структура и сложность."], ["Borderies", "Крю", "Небольшая площадь, цветочные и ореховые оттенки."], ["Fins Bois", "Крю", "Крупная зона, часто фруктовый характер."], ["Bons Bois", "Крю", "Разные почвы, профиль зависит от участка."], ["Bois Ordinaires", "Крю", "Близость океана, морские и растительные ассоциации."]]}, {"type": "note", "text": "Крю — не шкала «плохой — хороший». Fine Champagne — не крю, а купаж Grande и Petite Champagne, где Grande не менее 50%."}, {"type": "h", "text": "Классы по выдержке"}, {"type": "p", "text": "Указывают минимальную выдержку самого молодого спирта в купаже, а не средний возраст."}, {"type": "cards", "items": [["VS", "от 2 лет", "Very Special. Молодой, яркий, фруктовый — для коктейлей."], ["VSOP", "от 4 лет", "Very Superior Old Pale. Округлее: фрукты, ваниль, специи, дерево."], ["XO", "от 10 лет", "Extra Old. Сухофрукты, орехи, специи, кожа, дуб."], ["XXO", "от 14 лет", "Extra Extra Old. Сложные древесные и сухофруктовые оттенки."]]}, {"type": "note", "text": "Napoléon, Hors d’Âge, Réserve — не считайте автоматически определённым возрастом. VS не значит плохой, XO не значит, что понравится всем."}]}, {"id": "types", "title": "Другие бренди", "blocks": [{"type": "h", "text": "Арманьяк"}, {"type": "p", "text": "Гасконь, юго-запад Франции. Часто однократная непрерывная перегонка — больше характера сырья, насыщенный профиль."}, {"type": "table", "head": ["Обозначение", "Мин. выдержка"], "rows": [["VS / 3 звезды", "1 год"], ["VSOP", "4 года"], ["XO / Napoléon", "6 лет"]]}, {"type": "p", "text": "Vintage — на этикетке год урожая или дистилляции. Это другой принцип, чем возрастная категория купажа."}, {"type": "h", "text": "Brandy de Jerez"}, {"type": "p", "text": "Испания, бочки из-под хереса: сухофрукты, орехи, ваниль, карамель."}, {"type": "table", "head": ["Категория", "Средний возраст"], "rows": [["Solera", "от 6 месяцев"], ["Solera Reserva", "от 1 года"], ["Solera Gran Reserva", "от 3 лет"]]}, {"type": "note", "text": "Важно слово «средний»: в системе solera спирты разных возрастов постоянно смешиваются."}, {"type": "h", "text": "Ещё"}, {"type": "list", "items": ["Pisco — Перу и Чили, часто без выдержки в дереве", "Fruit brandy — бренди из фруктов, у многих свои названия", "Metaxa — не приравнивать к обычному бренди: своя рецептура"]}, {"type": "note", "text": "ЕС: Brandy / Weinbrand — выдержка от 1 года в ёмкостях от 1000 л или от 6 месяцев в меньших бочках, крепость от 36%. У коньяка требования строже."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "olist", "items": ["Аромат: виноград, цветы, фрукты, ваниль, сухофрукты, специи.", "Глоток: текстура, сладость, дерево, баланс, крепость.", "Послевкусие: фруктовое, ореховое, пряное, древесное.", "Разная температура: тепло усиливает спирт, прохлада — свежие фрукты.", "Сравните VS и XO одного производителя."]}, {"type": "note", "text": "Шарообразный бокал и согревание в ладонях не обязательны — тюльпан удобнее. Пить можно чистым, со льдом или в коктейлях."}]}, {"id": "cocktails", "title": "Коктейли", "blocks": [{"type": "cocktails", "items": [["Sidecar", "Виноградный характер, цитрусовая кислотность и апельсин.", ["50 мл коньяка", "20 мл апельсинового ликёра", "20 мл лимонного сока"], "Встряхнуть со льдом, процедить в охлаждённый коктейльный бокал."], ["French 75 на коньяке", "Коньяк даёт виноградную глубину.", ["30 мл коньяка", "15 мл лимонного сока", "10 мл сахарного сиропа", "60–90 мл сухого игристого"], "Первые три встряхнуть со льдом, процедить, долить игристым."], ["Brandy Alexander", "Десертный, шоколадно-сливочный.", ["30 мл бренди или коньяка", "30 мл тёмного какао-ликёра", "30 мл сливок"], "Встряхнуть со льдом, процедить, натереть мускатный орех."], ["Vieux Carré", "Сложный, пряный.", ["30 мл ржаного виски", "30 мл коньяка", "30 мл сладкого вермута", "5 мл бенедиктина", "2 дэша ароматического биттера", "2 дэша Peychaud’s"], "Перемешать со льдом, процедить на свежий лёд."]]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "table", "head": ["Напиток", "Главное", "Во вкусе"], "rows": [["Cognac", "Франция, двойная перегонка", "Фрукты, цветы, ваниль, специи"], ["Armagnac", "Гасконь, часто однократная перегонка", "Насыщенные фрукты, специи"], ["Brandy de Jerez", "Испания, хересные бочки, solera", "Сухофрукты, орехи, карамель"], ["Другие бренди", "Разные страны и технологии", "Зависит от категории"]]}, {"type": "p", "text": "Молодой фруктовый коньяк — для Sidecar, выдержанный — для дегустации, Brandy de Jerez — для ореховых и сухофруктовых коктейлей. Возраст и происхождение помогают понять напиток, но выбор — по вкусу, балансу и подаче."}]}], "cover": "img/mvxup55r.jpg"}, {"id": "wine", "num": "10", "name": "Вино", "en": "Wine", "tagline": "От виноградной лозы до бокала", "facts": [["Крепость", "≈ 11–15%"], ["Родина", "Кавказ"], ["Главное", "Виноград"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Вино — это не просто перебродивший виноградный сок. Его вкус зависит от сорта винограда, климата, почвы, работы винодела и даже времени, проведённого в бутылке."}, {"type": "p", "text": "Две бутылки из одного сорта могут совершенно не походить друг на друга. И наоборот: вина из разных стран иногда оказываются удивительно похожими."}, {"type": "steps", "items": [["Виноград", "Основное сырьё — виноград вида Vitis vinifera. В нём есть всё нужное: вода, сахара, кислоты, ароматические вещества и соединения, влияющие на структуру."], ["Брожение", "Дрожжи превращают сахар виноградного сока в этиловый спирт и углекислый газ. Это алкогольное брожение."], ["Вино", "Готовый напиток. Дальше его могут выдерживать, осветлять, стабилизировать и разливать."]]}, {"type": "note", "text": "В отличие от виски, коньяка или рома, вино не перегоняют. Поэтому алкоголя в нём заметно меньше — обычно примерно 11–15%, хотя бывают вина и за пределами этого диапазона."}]}, {"id": "history", "title": "История", "blocks": [{"type": "timeline", "items": [["≈ 6000–5800 до н. э.", "Одни из самых ранних археологических свидетельств виноделия — на территории современной Грузии. Вино бродило и хранилось в больших глиняных сосудах — квеври."], ["Античность", "Вино становится частью культуры Древней Греции, Рима и Ближнего Востока. Римляне развивают виноградарство, торгуют вином и распространяют его по империи."], ["Средние века", "Монастыри сохраняют и развивают винодельческие традиции Европы."], ["Новое время", "Европейские переселенцы привозят лозу и технологии в Америку, Южную Африку, Австралию и Новую Зеландию."]]}, {"type": "note", "text": "Традиционный грузинский метод виноделия в квеври включён в список нематериального культурного наследия ЮНЕСКО."}]}, {"id": "types", "title": "Виды", "blocks": [{"type": "cards", "items": [["Красное", "Тёмный виноград · контакт с кожицей", "Кожица даёт цвет и значительную часть танинов — веществ, создающих ощущение терпкости."], ["Белое", "Сок отделяют до брожения", "Можно сделать как из светлого, так и из некоторых тёмных сортов винограда."], ["Розовое", "Короткий контакт с кожицей", "Сок тёмного винограда недолго настаивают на кожице. Цвет — от почти прозрачного розового до насыщенного малинового."], ["Игристое", "Растворённый CO₂", "Пузырьки появляются при вторичном брожении в бутылке или в герметичном резервуаре, а также другими разрешёнными методами."], ["Оранжевое", "Белое с долгой мацерацией", "Белое вино с длительным контактом сока с кожицей. Выраженная текстура, танинность, необычные ароматы."]]}, {"type": "note", "text": "Отдельная категория — креплёные вина: портвейн, херес некоторых стилей, мадера, марсала. В них добавляют виноградный спирт или другой разрешённый винный дистиллят по правилам категории."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "p", "text": "Производство начинается задолго до винодельни — на винограднике. Винодел выбирает момент сбора урожая по сахаристости, кислотности, зрелости кожицы и семян и по желаемому стилю вина."}, {"type": "steps", "items": [["Сбор винограда", "Ручной или механизированный."], ["Сортировка и дробление", "Убирают неподходящие ягоды, иногда гребни, и готовят сырьё."], ["Брожение", "Дрожжи перерабатывают сахар в спирт. Для красного вина обычно важен контакт с кожицей."], ["Выдержка", "В стальных ёмкостях, бетонных резервуарах, глиняных сосудах или дубовых бочках."], ["Осветление, стабилизация, розлив", "В зависимости от стиля и решений винодела."]]}, {"type": "h", "text": "Зачем нужна дубовая бочка"}, {"type": "p", "text": "Дуб может придавать вину оттенки ванили, специй, тостов, кокоса и древесины. Через древесину идёт медленный газообмен, который влияет на развитие вина."}, {"type": "note", "text": "Хорошему вину не обязательна бочка. Некоторые выдающиеся вина выдерживают только в стали или других нейтральных ёмкостях."}]}, {"id": "grapes", "title": "Сорта", "blocks": [{"type": "p", "text": "Сортов винограда тысячи, но для знакомства с вином достаточно нескольких международно известных."}, {"type": "h", "text": "Красные сорта"}, {"type": "cards", "items": [["Каберне Совиньон", "Cabernet Sauvignon", "Насыщенные, танинные вина: чёрная смородина, тёмные ягоды, иногда зелёный перец."], ["Пино Нуар", "Pinot Noir", "Деликатная структура: вишня, малина, цветы, иногда лесная подстилка."], ["Мерло", "Merlot", "Слива, мягкие ягодные оттенки, округлая текстура."], ["Сира / Шираз", "Syrah / Shiraz", "Тёмные ягоды, чёрный перец, пряности, насыщенная структура."]]}, {"type": "h", "text": "Белые сорта"}, {"type": "cards", "items": [["Шардоне", "Chardonnay", "Очень универсальный: от свежих цитрусовых вин до насыщенных сливочных с дубовой выдержкой."], ["Совиньон Блан", "Sauvignon Blanc", "Травянистые, цитрусовые, крыжовниковые и тропические ароматы."], ["Рислинг", "Riesling", "Яркая кислотность, цветочные и фруктовые ароматы. Бывает и абсолютно сухим, и сладким."], ["Пино Гри / Пино Гриджо", "Pinot Gris / Pinot Grigio", "В зависимости от региона и стиля — от лёгких свежих до насыщенных, текстурных вин."]]}, {"type": "note", "text": "«Вишня» или «смородина» в описании не значит, что в вино добавляли ягоды. Это дегустационные ассоциации от природных ароматических соединений."}]}, {"id": "regions", "title": "Регионы", "blocks": [{"type": "p", "text": "Винный мир традиционно делят на Старый Свет — прежде всего европейские страны с многовековой историей виноделия — и Новый Свет: Америку, Австралию, Новую Зеландию, ЮАР и другие."}, {"type": "note", "text": "Это историко-культурное деление, а не гарантия определённого вкуса."}, {"type": "cards", "items": [["Франция", "Старый Свет", "Бордо — купажи на основе Каберне Совиньон и Мерло. Бургундия — Пино Нуар и Шардоне. Шампань — игристые вина с защищённым происхождением. Свои традиции у Луары, Роны и Эльзаса."], ["Италия", "Старый Свет", "Тоскана — Санджовезе, Кьянти, Брунелло. Пьемонт — Неббиоло, Бароло, Барбареско. Венето — Просекко, Соаве, Амароне. Огромное разнообразие местных сортов."], ["Испания", "Старый Свет", "Риоха и Рибера-дель-Дуэро — красные на основе Темпранильо. Приорат — мощные красные. Херес — особые креплёные вина."], ["Германия", "Старый Свет", "Прежде всего Рислинг: Мозель, Рейнгау, Пфальц — от лёгких сухих до сложных сладких. Красный Шпетбургундер — немецкое название Пино Нуар."], ["Грузия", "Старый Свет", "Один из исторических центров виноделия. Традиция квеври, местные сорта Саперави и Ркацители."], ["США", "Новый Свет", "Калифорния (Напа, Сонома) — Каберне Совиньон и Шардоне. Орегон — Пино Нуар. Вашингтон — разнообразные красные и белые."], ["Аргентина и Чили", "Новый Свет", "Аргентина — Мальбек, особенно из Мендосы. Чили — Каберне Совиньон, Карменер и другие сорта в разных климатах."], ["Австралия и Новая Зеландия", "Новый Свет", "Долина Баросса — насыщенный Шираз. Мальборо — яркий Совиньон Блан. Центральный Отаго — Пино Нуар."]]}, {"type": "p", "text": "Не стоит забывать о Португалии, Австрии, Южной Африке, Греции и других странах — вино делают на всех обитаемых континентах."}, {"type": "h", "text": "Терруар"}, {"type": "p", "text": "Терруар — совокупность природных условий и особенностей виноградарства, связанных с местом: климат, рельеф, почва, доступность воды, экспозиция склонов. Например, Пино Нуар из прохладной Бургундии заметно отличается от Пино Нуар из тёплого региона."}, {"type": "note", "text": "Почва не передаёт вину вкус камня буквально. «Минеральность» — описание впечатления, а не доказательство, что аромат создали минералы из почвы. Терруар — влияние места, а не магия географического названия."}]}, {"id": "label", "title": "Этикетка", "blocks": [{"type": "h", "text": "Пять вещей, которые ищем на этикетке"}, {"type": "olist", "items": ["Страна и регион — откуда вино.", "Производитель — кто его сделал.", "Сорт винограда — если указан.", "Год урожая — винтаж.", "Категория происхождения — AOP во Франции, DOC/DOCG в Италии, DO/DOCa в Испании."]}, {"type": "p", "text": "Новый Свет часто пишет сорт крупно: Cabernet Sauvignon, Chardonnay. Традиционная французская этикетка может указывать только место — Bordeaux, Chablis, Châteauneuf-du-Pape, и чтобы понять сортовой состав, нужно знать правила региона."}, {"type": "note", "text": "Старое вино не обязательно лучше молодого: многие вина делают, чтобы пить в первые годы после выпуска."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "Дегустация — не попытка угадать дорогую бутылку с закрытыми глазами, а способ внимательно оценить напиток."}, {"type": "steps", "items": [["Внешний вид", "Цвет, прозрачность, насыщенность. Цвет подсказывает сорт, технологию и развитие вина, но сам по себе не определяет качество."], ["Аромат", "Сначала понюхайте, затем слегка покрутите бокал. Ищите фруктовые, цветочные, пряные, травяные, древесные ассоциации."], ["Вкус", "Кислотность, сладость, танины, алкоголь, тело и длина послевкусия."]]}, {"type": "table", "head": ["Термин", "Что означает"], "rows": [["Кислотность", "Ощущение свежести, вызывающее слюноотделение"], ["Танины", "Терпкость и сухость во рту, характерные для многих красных вин"], ["Тело", "Ощущение плотности и веса напитка"], ["Баланс", "Насколько гармонично сочетаются кислотность, сладость, танины, алкоголь и аромат"]]}, {"type": "note", "text": "Не путайте сухость и терпкость. Сухое вино — это мало остаточного сахара, а терпкость связана с танинами."}, {"type": "h", "text": "Практика: четыре вина"}, {"type": "table", "head": ["Вино", "На что обратить внимание"], "rows": [["Совиньон Блан", "Цитрусовые и травянистые ноты, кислотность"], ["Шардоне", "Текстура и аромат в сравнении с первым образцом; для контраста — стиль с дубом"], ["Пино Нуар", "Красные ягоды, сравнительно лёгкое тело и танины"], ["Каберне Совиньон", "Насыщенность, танины, послевкусие"]]}, {"type": "p", "text": "Небольших порций достаточно; пробовать и сплёвывать — нормальная профессиональная практика. Спросите команду: какое вино кислотнее, какое терпче, какое нравится больше. Единственно правильного ответа нет."}]}, {"id": "food", "title": "С едой", "blocks": [{"type": "cards", "items": [["Кислотное белое + рыба и морепродукты", "Свежесть", "Свежесть вина хорошо сочетается с нежными блюдами, лимоном и зеленью."], ["Танинное красное + мясо", "Структура", "Белки и жиры некоторых мясных блюд смягчают восприятие терпкости."], ["Рислинг с остаточным сахаром + острое", "Баланс", "Небольшая сладость уравновешивает ощущение остроты."], ["Сладкое вино + десерты или голубые сыры", "Контраст", "Контраст сладости и солёности даёт особенно интересное сочетание."]]}, {"type": "note", "text": "Нет закона «к рыбе — только белое, к мясу — только красное». Важнее способ приготовления, соус и интенсивность блюда."}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "table", "head": ["Тема", "Что запомнить"], "rows": [["История", "Древнейшие свидетельства виноделия — Кавказ, около 6000 года до н. э."], ["Сырьё", "Виноград, преимущественно Vitis vinifera"], ["Технология", "Алкогольное брожение без перегонки"], ["Виды", "Красное, белое, розовое, игристое, оранжевое"], ["Красные сорта", "Каберне Совиньон, Мерло, Пино Нуар, Сира"], ["Белые сорта", "Шардоне, Совиньон Блан, Рислинг, Пино Гри"], ["Дегустация", "Аромат, кислотность, сладость, танины, тело, баланс, послевкусие"], ["Главное", "Вкус вина формируют сорт, место, технология и время"]]}, {"type": "h", "text": "Пять мифов о вине"}, {"type": "table", "head": ["Миф", "Реальность"], "rows": [["Чем старше вино, тем лучше", "Большинство вин не предназначено для длительной выдержки"], ["Белое — только из белого винограда", "Белое вино можно сделать и из тёмного винограда, если быстро отделить сок от кожицы"], ["Винтовая крышка — значит дешёвое", "Качественные вина используют разные типы укупорки"], ["Осадок — вино испортилось", "У некоторых вин осадок образуется естественно при выдержке"], ["Дорогое — обязательно вкуснее", "Цена зависит от многих факторов и не гарантирует удовольствия"]]}, {"type": "quiz", "q": "Почему вино обычно слабее виски или коньяка?", "a": "Вино не перегоняют: алкоголь в нём только от брожения, поэтому обычно около 11–15%."}, {"type": "quiz", "q": "Можно ли сделать белое вино из тёмного винограда?", "a": "Да. Если быстро отделить сок от кожицы, цвет и танины почти не перейдут в вино."}, {"type": "quiz", "q": "Гость просит сухое, но «не терпкое» вино. Это противоречие?", "a": "Нет. Сухость — это мало сахара, а терпкость — танины. Подойдёт сухое белое или лёгкое красное с мягкими танинами."}, {"type": "quiz", "q": "Что подать к острому блюду?", "a": "Например, Рислинг с небольшим остаточным сахаром — сладость уравновешивает остроту."}, {"type": "p", "text": "Хорошее вино — не обязательно самое дорогое, старое или знаменитое. Это вино, которое качественно сделано, подходит к ситуации и нравится тому, кто его пробует."}]}], "cover": "img/mvxuqiuz.jpg"}, {"id": "vermouth", "num": "07", "name": "Вермут", "en": "Vermouth", "tagline": "Ароматизированное вино: от лечебных настоев до барной классики", "facts": [["Основа", "Вино"], ["Родина", "Турин, Пьемонт"], ["Главное", "Полынь"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Вермут — ароматизированное вино, в которое добавляют экстракты или настои растений, специй, корней и цитрусовых. Обычно его подслащивают, а крепость корректируют спиртом или винным дистиллятом."}, {"type": "p", "text": "Главный исторический и вкусовой ориентир — полынь. С ней связывают и название: немецкое Wermut означает «полынь»."}, {"type": "note", "text": "Вермут — не крепкий алкоголь: его основа вино, а не дистиллят. Это самостоятельный напиток, его можно подавать охлаждённым или со льдом."}, {"type": "h", "text": "Из чего делают вермут"}, {"type": "cards", "items": [["Вино", "Основа", "Даёт кислотность, виноградные и фруктовые ноты, тело и структуру."], ["Ботаникалы", "Аромат", "Полынь, горечавка, дягиль, ромашка, кардамон, корица, гвоздика, цитрусовые корки и многое другое."], ["Алкоголь", "Крепость", "Корректирует крепость, помогает извлекать ароматы и делает продукт стабильным."], ["Сахар", "Сладость", "Регулирует сладость и связывает горькие, пряные и винные компоненты."]]}, {"type": "p", "text": "Точный состав — часть рецептуры производителя. Два вермута одного цвета и сладости могут иметь совершенно разные растения и аромат."}]}, {"id": "history", "title": "История", "blocks": [{"type": "timeline", "items": [["Древность", "Вино с травами и специями существует задолго до современного вермута — как ароматный напиток и в лечебных целях."], ["1786, Турин", "В Пьемонте формируется коммерческая традиция сладкого вермута. С одним из первых известных коммерческих вермутов связывают Антонио Бенедетто Карпано."], ["XIX век", "Развиваются итальянские и французские стили. Вермут становится популярным аперитивом и частью культуры кафе."], ["Конец XIX — XX век", "Вермут закрепляется в классике: Martini, Manhattan, Negroni."]]}, {"type": "note", "text": "Вермут появился не как добавка к джину, а как самостоятельный винный напиток. В коктейлях он ценен тем, что объединяет аромат, горечь, сладость и винную кислотность."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "steps", "items": [["Подготовка вина", "Выбирают винную основу с подходящей кислотностью и нейтральным или выразительным фруктовым профилем."], ["Извлечение ароматов", "Растения настаивают в спирте, вине или водно-спиртовой смеси. Некоторые производители дистиллируют отдельные компоненты."], ["Купажирование", "Смешивают вино и ароматические компоненты, корректируют сладость, крепость и цвет."], ["Отдых и розлив", "Купажу дают стабилизироваться, при необходимости фильтруют и разливают. Некоторые вермуты дополнительно выдерживают."]]}, {"type": "p", "text": "Это обобщённая схема: порядок операций и способы экстракции у производителей отличаются."}]}, {"id": "types", "title": "Стили", "blocks": [{"type": "cards", "items": [["Rosso / Sweet", "Красный, сладкий · Италия", "Сладкий, пряный, с травяной горечью: карамель, ваниль, корица, апельсин, сухофрукты. Цвет часто от карамельного колера, а не от красного вина. Negroni, Manhattan, Americano."], ["Bianco / Blanc", "Белый · Италия и Франция", "Светлый, мягкий, сладковатый: цветы, ваниль, цитрус, специи. Не обязательно лёгкий по вкусу. Вариации Martini, Vermouth & Tonic, лёгкие аперитивы."], ["Dry / Extra Dry", "Сухой · исторически Франция", "Суше, травянистее, часто цитрусовый. Сладость ниже, но не нулевая. Бывают солоноватые, цветочные, минеральные ноты. Dry Martini, Bamboo."], ["Ambrato / Amber", "Янтарный", "Цветочный, травянистый, пряный, умеренно сладкий. Не категория сладости — смотрите на этикетку."]]}, {"type": "note", "text": "Цвет и сладость — разные характеристики. Белый вермут может быть сладким, а красный — разной степени сладости. Extra Dry на этикетке — нормативная категория по содержанию сахара, а не субъективная оценка вкуса."}, {"type": "h", "text": "Страны и традиции"}, {"type": "cards", "items": [["Италия", "Насыщенность и пряность", "Турин и Пьемонт — исторический центр. Традиция сладкого Rosso, но есть и белые, и сухие стили."], ["Франция", "Сухие и ароматные", "Особенно известна сухими вермутами; встречаются травяные, цветочные, цитрусовые и выдержанные."], ["Испания", "Культура аперитива", "Пьют отдельно, со льдом, содовой или цитрусом, с закусками. Единого профиля нет."]]}, {"type": "p", "text": "Это ориентиры, а не правила: французский вермут не обязательно сухой, а итальянский не обязательно сладкий."}]}, {"id": "bar", "title": "В баре", "blocks": [{"type": "p", "text": "Вермут не просто добавляет алкоголь — он связывает крепкую базу с остальными ингредиентами."}, {"type": "table", "head": ["Что даёт", "Зачем"], "rows": [["Сладость", "Смягчает резкость крепкого алкоголя, балансирует горечь"], ["Кислотность", "Свежесть и ощущение структуры"], ["Травы", "Связывают ботаникалы джина, специи виски, горькие ликёры"], ["Горечь", "Глубина и длинное послевкусие"]]}, {"type": "h", "text": "Работа с вермутом"}, {"type": "list", "items": ["Подача: охлаждённым, со льдом или с содовой — зависит от стиля.", "После вскрытия вермут окисляется: закрывайте бутылку и храните в холодильнике. Универсального срока для всех марок нет.", "Перед использованием проверяйте аромат и вкус. Затхлые, уксусные, окисленные ноты — не для гостевого коктейля.", "Пробуйте вермут отдельно и в коктейле: слишком сладкий сам по себе может идеально сбалансировать горький ингредиент."]}]}, {"id": "cocktails", "title": "Коктейли", "blocks": [{"type": "cocktails", "items": [["Negroni", "Вермут соединяет можжевельник джина с горечью Campari, добавляет сладость и пряность.", ["30 мл джина", "30 мл красного сладкого вермута", "30 мл Campari"], "Stir со льдом, процедить на свежий лёд, украсить апельсином."], ["Manhattan", "Вермут смягчает пряность виски, добавляет винную глубину и травы.", ["60 мл ржаного виски", "30 мл сладкого вермута", "2 дэша Angostura"], "Stir со льдом, процедить в охлаждённый бокал, коктейльная вишня."], ["Dry Martini", "Вермут добавляет винные и травяные ноты, чтобы джин не звучал только спиртом. Соотношение меняют под гостя.", ["60 мл джина", "10 мл сухого вермута"], "Stir со льдом, процедить в охлаждённый бокал. Оливка или лимонный твист."]]}, {"type": "note", "text": "Пропорции — рабочие рецепты для обучения, а не единственно допустимые формулы."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "Для короткого обучения возьмите по одному образцу Rosso, Bianco и Dry. Наливайте небольшие порции и сравнивайте в одинаковых условиях, записывая ощущения по каждому."}, {"type": "table", "head": ["Стиль", "Чего ожидать"], "rows": [["Rosso", "Сладость, пряность, травяная горечь, карамель, апельсин"], ["Bianco", "Мягкость, цветы, ваниль, цитрус"], ["Dry", "Сухость, травы, цитрус, иногда солоноватость"]]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "olist", "items": ["Вермут — ароматизированное вино, а не крепкий алкоголь.", "Ключевое растение — полынь, от неё и название.", "Современная традиция — Турин, XVIII век.", "Цвет и сладость — разные вещи: белый может быть сладким.", "После вскрытия — в холодильник и проверка перед подачей."]}, {"type": "quiz", "q": "Почему Rosso красный, если его не обязательно делают из красного вина?", "a": "Цвет часто дают карамельным колером. Поэтому цвет вермута не говорит ни о вине в основе, ни о сладости."}, {"type": "quiz", "q": "Что делает вермут в Negroni?", "a": "Связывает можжевеловую основу джина с горечью Campari, добавляя сладость и пряность."}, {"type": "quiz", "q": "Как понять, что открытый вермут уже нельзя подавать гостю?", "a": "Вместо свежих трав, фруктов и специй появляются затхлые, уксусные или неприятно окисленные ноты."}]}], "cover": "img/mvxurr7l.jpg"}, {"id": "apdig", "num": "08", "name": "Аперитивы и дижестивы", "en": "Aperitif & Digestif", "tagline": "Что подать до еды и что после", "facts": [["Аперитив", "До еды"], ["Дижестив", "После еды"], ["Решает", "Контекст подачи"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Аперитив — напиток перед едой: готовит гостя к трапезе, создаёт настроение, дополняет закуски. Дижестив — напиток после еды, в завершение трапезы."}, {"type": "p", "text": "Аперитивы чаще сухие, освежающие, горьковатые или умеренно алкогольные. Дижестивы бывают крепкими, сладкими, горькими, травяными или выдержанными."}, {"type": "note", "text": "Это гастрономическая и культурная классификация, а не деление по крепости или составу. Один и тот же напиток может выполнять обе роли — всё решают подача, кухня и традиция."}, {"type": "h", "text": "Главная разница"}, {"type": "table", "head": ["", "Аперитив", "Дижестив"], "rows": [["Когда", "До еды", "После еды"], ["Задача", "Открыть трапезу, освежить", "Завершить трапезу"], ["Профиль", "Сухой, свежий, горьковатый", "Насыщенный, сладкий, травяной, выдержанный"], ["Крепость", "Чаще умеренная", "Чаще выше"], ["Порция", "Бокал, хайбол, спритц", "Небольшая порция"]]}, {"type": "p", "text": "Это общие тенденции, а не правила: аперитив может быть крепким, а дижестив — относительно лёгким."}]}, {"id": "aperitifs", "title": "Аперитивы", "blocks": [{"type": "cards", "items": [["Игристые и винные", "Свежесть, кислотность", "Игристое, белое или розовое вино, иногда с биттером или ликёром. Prosecco, Champagne, Kir (белое вино с ликёром из чёрной смородины), Aperol Spritz."], ["Вермуты и ароматизированные вина", "Винный, травянистый", "Вино с травами, специями, корнями, цитрусом; от сухого до сладкого. Dry Martini, Vermouth & Soda, Vermouth Tonic, Lillet с содовой."], ["Горькие — bitter", "Горечь, цитрус, травы", "Campari, Aperol, Select Aperitivo, Cappelletti Aperitivo. Самостоятельно, со льдом и содовой или в коктейлях."], ["Анисовые", "Анис, лакрица", "Юг Франции и Средиземноморье: Pastis, Ricard, Pernod. Подают с холодной водой — при разбавлении мутнеют из-за эмульсии эфирных масел."], ["Лёгкие коктейли", "Свежесть, газ", "Коктейль тоже может быть аперитивом: Gin & Tonic, Americano, Hugo Spritz, безалкогольный bitter spritz."]]}]}, {"id": "digestifs", "title": "Дижестивы", "blocks": [{"type": "cards", "items": [["Амаро и травяные биттеры", "Травы, корни, горечь", "Итальянское семейство горько-сладких настоек и ликёров на травах, корнях, специях и цитрусе. Например: Fernet-Branca, Averna, Montenegro. Крепость и сладость сильно различаются."], ["Выдержанные виноградные дистилляты", "Сухофрукты, дуб, ваниль", "Небольшие порции после еды, особенно в европейской ресторанной культуре. Например: коньяк, арманьяк, Brandy de Jerez."], ["Фруктовые и выжимковые", "От фруктов до пряности", "Из ферментированных фруктов или виноградных выжимок. Например: кальвадос, граппа, кирш."], ["Сладкие ликёры", "От цитруса до орехов", "Небольшая порция в конце трапезы. Например: лимончелло, амаретто, Chartreuse, Bénédictine."], ["Креплёные и десертные вина", "Орехи, карамель, изюм", "Часто в паре с десертом или сыром. Например: портвейн, херес олоросо или PX, мадера, марсала."]]}, {"type": "p", "text": "Это основные категории, а не закрытый список: дижестивом в зависимости от традиции может быть и другой напиток."}]}, {"id": "examples", "title": "Примеры", "blocks": [{"type": "p", "text": "Нажмите на напиток, чтобы увидеть его типичную роль и что сказать гостю."}, {"type": "picker", "items": [["Campari", "ap", "Горько-сладкий биттер: цитрус и травы. Подают до еды со льдом и содовой или в Negroni и Americano.", "Негрони, Кампари спритц"], ["Aperol", "ap", "Мягче и слаще Campari, яркий апельсин. Классика — Aperol Spritz с игристым и содовой.", "Апероль спритц"], ["Prosecco", "ap", "Свежее игристое с фруктовыми и цветочными нотами — универсальный аперитив и основа спритцев.", "Prosecco Bruni Brut, Pianeta Organico"], ["Вермут", "both", "До еды — с содовой или тоником; после еды можно подать насыщенный сладкий Rosso. Роль зависит от подачи.", "Martini Fiero, Bianco, Rosso, Padro Rojo, Мартини фиеро тоник"], ["Lillet", "ap", "Французское ароматизированное вино, цитрусовое и фруктовое. Классика — с содовой и льдом.", ""], ["Pastis", "ap", "Анисовый аперитив юга Франции. Разбавляют холодной водой — напиток мутнеет, это норма.", ""], ["Gin & Tonic", "ap", "Пример коктейля в роли аперитива: свежий, газированный, горьковатый от хинина.", "Джин тоник"], ["Херес", "both", "Сухой фино — до еды к закускам, сладкие олоросо и PX — после еды к десерту или сыру.", ""], ["Коньяк", "dg", "Выдержанный виноградный дистиллят: сухофрукты, дуб, ваниль. Небольшая порция в конце ужина.", "Courvoisier VS, VSOP"], ["Fernet-Branca", "dg", "Очень горький амаро с мятой и травами. Подают небольшой порцией после еды.", ""], ["Амаро (Averna, Montenegro)", "dg", "Горько-сладкие травяные ликёры. Часто подают отдельно, без закуски.", ""], ["Граппа", "dg", "Итальянский дистиллят из виноградных выжимок: от чистой и фруктовой до выдержанной.", ""], ["Кальвадос", "dg", "Яблочный дистиллят из Нормандии; выдержанный — с нотами печёного яблока и дуба.", ""], ["Лимончелло", "dg", "Сладкий лимонный ликёр, подают сильно охлаждённым в маленькой рюмке.", ""], ["Амаретто", "dg", "Сладкий ликёр с миндальным профилем; хорош с кофе и десертом.", ""], ["Портвейн", "dg", "Креплёное вино: сухофрукты, карамель, изюм. Классическая пара — сыр или шоколад.", ""]]}]}, {"id": "serve", "title": "Подача", "blocks": [{"type": "h", "text": "К аперитивам"}, {"type": "p", "text": "Оливки, солёные орехи, сыр, хлебные закуски, лёгкие морепродукты, антипасти. Задача — не перегрузить вкус до основной еды."}, {"type": "h", "text": "К дижестивам"}, {"type": "list", "items": ["Выдержанные дистилляты — тёмный шоколад и орехи.", "Сладкие вина — десерты и сыры.", "Цитрусовые ликёры — лёгкие десерты.", "Горькие амаро — часто без закуски."]}, {"type": "note", "text": "Единой температуры и бокала для всех нет — ориентируйтесь на конкретный продукт и рекомендации производителя."}, {"type": "h", "text": "Про пищеварение"}, {"type": "p", "text": "Слово digestif связано с традицией подавать напиток после еды, но медицински он пищеварению не помогает: алкоголь может раздражать желудок, а горький вкус пользы не гарантирует."}, {"type": "note", "text": "Говорите гостю «традиционный напиток после ужина» и не обещайте лечебный эффект. Безалкогольная альтернатива: газированная вода с цитрусом, безалкогольный bitter spritz, чай или кофе."}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "quiz", "q": "Что определяет, аперитив напиток или дижестив?", "a": "Прежде всего время и контекст подачи."}, {"type": "quiz", "q": "К какой категории чаще относят Campari?", "a": "Чаще к аперитивам."}, {"type": "quiz", "q": "Чем амаро отличается от коньяка по типу напитка?", "a": "Амаро — ароматизированный травяной ликёр или биттер, коньяк — виноградный дистиллят."}, {"type": "quiz", "q": "Может ли вермут выступать в обеих ролях?", "a": "Да, в зависимости от подачи."}, {"type": "quiz", "q": "Почему нельзя утверждать, что любой дижестив улучшает пищеварение?", "a": "Это культурная традиция, а не гарантированный медицинский эффект."}]}], "cover": "img/mvxuu0qk.jpg"}, {"id": "beer", "num": "09", "name": "Пиво", "en": "Beer", "tagline": "Лагеры, эли и всё, что между ними", "facts": [["Основа", "Солод, хмель"], ["Семейства", "Лагер и эль"], ["Горечь", "IBU"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Пиво получают сбраживанием сусла из солода или другого крахмалсодержащего сырья с помощью пивных дрожжей. Традиционные ингредиенты — вода, солод, хмель и дрожжи."}, {"type": "table", "head": ["Ингредиент", "Что даёт"], "rows": [["Вода", "Влияет на ход варки и восприятие вкуса"], ["Солод", "Сахара для брожения, цвет, ноты хлеба, зерна, карамели, печенья, жареного кофе"], ["Хмель", "Горечь и аромат: цитрус, цветы, травы, смола, тропики"], ["Дрожжи", "Алкоголь, углекислый газ и ароматические соединения"]]}, {"type": "p", "text": "Пшеница, овёс, рожь, рис, фрукты и специи дают огромное разнообразие стилей."}, {"type": "note", "text": "Стиль пива — это не цвет и не крепость, а сочетание аромата, вкуса, горечи, плотности, карбонизации и технологии. Руководства по стилям описывают сотни разновидностей и регулярно обновляются."}]}, {"id": "history", "title": "История", "blocks": [{"type": "timeline", "items": [["Древние цивилизации", "Пивоподобные зерновые напитки существуют тысячи лет; пивоварение известно в Месопотамии и Египте. Напитки были мутными и совсем не похожими на лагер."], ["Средневековая Европа", "Варят в домах, городах и монастырях из местного зерна и трав. Хмель постепенно становится важным: даёт горечь и помогает сохранять пиво."], ["XIX век", "Наука о брожении и промышленное охлаждение позволяют стабильно варить лагеры. В 1842 году в Пльзене начинают варить светлое пиво, связанное со стилем Pilsner."], ["XX–XXI века", "Массовый светлый лагер становится самым распространённым. Крафтовое движение возвращает интерес к локальным традициям, хмелям, стаутам, кислым элям и историческим стилям."]]}, {"type": "note", "text": "История пива не сводится к одной стране или дате: традиции развивались параллельно в разных культурах."}]}, {"id": "families", "title": "Брожение", "blocks": [{"type": "p", "text": "Первый шаг в классификации — тип брожения."}, {"type": "cards", "items": [["Lager — лагер", "Нижовое брожение", "Дрожжи Saccharomyces pastorianus, низкие температуры, затем выдержка в холоде. Чистый аромат, солодовая основа, аккуратная горечь. Бывают насыщенные — Bock, Doppelbock. Примеры: Pilsner, Helles, Märzen, Dunkel, Schwarzbier, Bock."], ["Ale — эль", "Верховое брожение", "Дрожжи Saccharomyces cerevisiae, более высокие температуры, фруктовые и пряные ноты (эфиры и фенолы). Примеры: Pale Ale, IPA, Bitter, Porter, Stout, Saison, Dubbel, Tripel."], ["Смешанное и спонтанное", "Дрожжи + бактерии", "Несколько видов дрожжей и бактерий или микроорганизмы среды: кислые, фруктовые, землистые, «фермерские» профили. Lambic, Gueuze, American Wild Ale."]]}, {"type": "note", "text": "«Дикое» не обязательно значит, что пиво бродило само: производитель может вносить выбранные культуры."}, {"type": "note", "text": "Цвет не определяет тип брожения: и светлое, и тёмное бывает лагером или элем. Kölsch — верховое брожение, но часто холодная выдержка."}]}, {"id": "styles", "title": "Стили", "blocks": [{"type": "p", "text": "Практическая классификация, чтобы объяснить гостю, чего ожидать. Это не полный перечень."}, {"type": "h", "text": "Светлые и освежающие"}, {"type": "cards", "items": [["Pilsner / Pils", "Чехия, Германия · лагер", "Золотистое, прозрачное, хмелевой аромат, заметная сбалансированная горечь. Чешский — округлее и солодовее, немецкий — суше и горче. Pilsner Urquell, Bitburger."], ["Helles", "Мюнхен · лагер", "Мягкая солодовая сладость, хлеб и зерно, сдержанная горечь. Augustiner Lagerbier Hell."], ["Light / International Pale Lager", "Лагер", "Лёгкое, освежающее, невысокая горечь; в массовых версиях бывают рис или кукуруза. Bud Light, Heineken."]]}, {"type": "h", "text": "Пшеничные"}, {"type": "cards", "items": [["Hefeweizen / Weissbier", "Германия · эль", "Часто мутное, банан и гвоздика от дрожжей, мягкое и пенное. Weihenstephaner, Schneider Weisse."], ["Witbier", "Бельгия · эль", "Светлое пшеничное с кориандром и цедрой, мягкая пряность и лёгкая кислинка. Hoegaarden."]]}, {"type": "h", "text": "Хмелевые"}, {"type": "cards", "items": [["Pale Ale", "Эль", "Баланс солода и хмеля. Американские — цитрус, хвоя, фрукты; английские — солодовее и землистее. Sierra Nevada Pale Ale."], ["West Coast IPA", "IPA", "Сухая, чёткая, с выраженной горечью. Stone IPA."], ["Hazy / New England IPA", "IPA", "Мутная, сочная, тропические фрукты, горечь ощущается мягче. Tree House Julius."], ["Session IPA", "IPA", "Легче по алкоголю, но с хмелевым характером."]]}, {"type": "h", "text": "Тёмные и солодовые"}, {"type": "cards", "items": [["Stout", "Британия, Ирландия · эль", "Жареное зерно, кофе, какао. Dry Stout суше и легче, чем кажется по цвету; Imperial — крепче и плотнее. Guinness Draught, Founders KBS."], ["Porter", "Эль", "Шоколад, кофе, орехи, карамель; часто менее жёстко жареный, чем сухой стаут. Fuller’s London Porter."], ["Dunkel / Schwarzbier", "Германия · лагер", "Dunkel — хлебная корочка, мягкая карамель. Schwarzbier темнее, с жареным солодом, но сухой и питкий. Ayinger Dunkel, Köstritzer."], ["Dubbel / Tripel", "Бельгия · эль", "Важны дрожжи. Dubbel — темнее, сухофрукты, карамель, специи. Tripel — светлее, крепче, фрукты и пряности. Westmalle."]]}, {"type": "h", "text": "Кислые и необычные"}, {"type": "cards", "items": [["Berliner Weisse", "Германия", "Лёгкий кислый стиль с освежающей кислотностью."], ["Gose", "Германия", "Традиционно кислый, часто с солью и кориандром."], ["Lambic / Gueuze", "Бельгия", "Особая микробиология брожения; Gueuze — купаж разных ламбиков."], ["Fruit Beer", "Стиль", "Пиво с фруктами; профиль зависит от основы и способа добавления."]]}, {"type": "note", "text": "Кислое пиво не обязательно фруктовое, а фруктовое не обязательно кислое."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "h", "text": "Цифры на этикетке"}, {"type": "table", "head": ["Показатель", "Что значит"], "rows": [["ABV, %", "Крепость — доля алкоголя"], ["IBU", "Показатель горечи от хмеля"], ["Цвет", "Зависит в основном от солода и не говорит о крепости"]]}, {"type": "note", "text": "IBU не равно ощущаемой горечи: сладость солода, крепость, аромат хмеля и плотность меняют баланс. Чёрный стаут может быть лёгким, а светлый эль — крепким."}, {"type": "h", "text": "Как дегустировать"}, {"type": "olist", "items": ["Внешний вид: цвет, прозрачность, пена и её стойкость.", "Аромат: солод, хлеб, карамель, хмель, цитрус, тропики, кофе, шоколад, дрожжи.", "Вкус: сладость, горечь, кислотность, жареные и фруктовые ноты.", "Тело: лёгкое, среднее, плотное; водянистое, кремовое, вязкое.", "Послевкусие: сухое, сладковатое, горькое, жареное, хмелевое.", "Баланс солода, хмеля, дрожжей и остальных компонентов."]}, {"type": "p", "text": "Для обучения сравнивайте контрастные стили рядом: Pilsner, Hefeweizen, IPA и Stout."}, {"type": "h", "text": "Температура подачи"}, {"type": "table", "head": ["Стиль", "Как подавать"], "rows": [["Лёгкие лагеры", "Прохладными — ради свежести"], ["Pilsner, Helles", "Охлаждёнными, но не до потери аромата"], ["Пшеничное", "Прохладным, в традиционном бокале"], ["IPA", "Холодным, но так, чтобы раскрылся хмель"], ["Stout, Porter, крепкие эли", "Чуть теплее лагера — для солода и аромата"]]}, {"type": "note", "text": "Слишком низкая температура скрывает аромат. Важны также чистый бокал, состояние линии розлива, хранение без света и перегрева."}]}, {"id": "guest", "title": "Подбор", "blocks": [{"type": "h", "text": "Вопросы гостю"}, {"type": "list", "items": ["Лёгкое и освежающее или насыщенное?", "Любите горчинку или мягкое, солодовое?", "Фруктовый аромат или кофе и шоколад?", "Сухой вкус или чуть сладковатый?"]}, {"type": "h", "text": "Что предложить — и что есть у нас"}, {"type": "table", "head": ["Гость хочет", "Стиль", "У нас"], "rows": [["Освежающее и чистое", "Pilsner, Helles", "Astrologer, Oettinger, Gusi Main Road, Asahi, Tsingtao"], ["Мягкое, банан и гвоздика", "Hefeweizen", "Gusi Clear Sky"], ["Пшеничное с цитрусом и кориандром", "Witbier", "Nous Et Vous, Jaws Blanche"], ["Яркий хмель", "Pale Ale, IPA", "On Base, Ostrovica IPA; б/а — Beerathlon"], ["Тёмное, кофейное", "Stout", "Guinness, Ace Cream, Konix Cappuccino Stout"], ["Тёмное, хлебное, без жареной горечи", "Dunkel", "Ближе всего — браун эли Gusi Big Rock, Tkhili"], ["Кислое и необычное", "Berliner Weisse, Gose, Lambic", "Сейчас нет в меню"]]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "p", "text": "Чтобы рекомендовать пиво, нужно понимать не только цвет и крепость, но и тип брожения, солод, горечь, аромат, тело и послевкусие."}, {"type": "quiz", "q": "Какие два семейства используют для базовой классификации пива?", "a": "Лагер и эль."}, {"type": "quiz", "q": "Чем Pilsner отличается от Helles?", "a": "Pilsner обычно хмелевее и горче, Helles мягче и солодовее."}, {"type": "quiz", "q": "Почему тёмное пиво не обязательно крепкое?", "a": "Цвет даёт солод, он не определяет крепость (ABV)."}, {"type": "quiz", "q": "Что означает IBU?", "a": "Показатель горечи."}, {"type": "quiz", "q": "Какие ароматы характерны для Hefeweizen?", "a": "Банан и гвоздика."}, {"type": "quiz", "q": "Чем West Coast IPA отличается от Hazy IPA?", "a": "West Coast суше и горче, Hazy мягче по горечи и сочнее по аромату."}, {"type": "quiz", "q": "Почему не всё пиво подают при одной температуре?", "a": "Температура влияет на восприятие вкуса и аромата."}]}], "cover": "img/mvxuv9zq.jpg"}, {"id": "coffee", "num": "11", "name": "Кофе", "en": "Coffee", "tagline": "От кофейной ягоды до идеальной чашки", "facts": [["Родина", "Эфиопия"], ["Виды", "Арабика, робуста"], ["Главное", "Обжарка"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Для многих кофе — просто способ проснуться. Но за привычной чашкой стоит огромный мир: сельское хозяйство, химия, география, технологии и культура целых стран."}, {"type": "p", "text": "Кофе во многом похож на вино: у него есть сорта, регионы происхождения, способы обработки и собственная система дегустации."}, {"type": "note", "text": "Кофейное зерно — вовсе не зерно, а семя плода кофейного дерева. Плоды называют кофейными ягодами или кофейными вишнями, внутри обычно два семени."}, {"type": "steps", "items": [["Ягода", "Кофейное дерево даёт плоды — кофейные вишни."], ["Обработка и сушка", "Семена извлекают, обрабатывают и сушат — получаются зелёные зёрна."], ["Обжарка", "Под действием температуры появляется знакомый кофейный аромат."], ["Помол и приготовление", "Зерно мелют и готовят напиток выбранным способом."]]}, {"type": "h", "text": "Два главных вида"}, {"type": "cards", "items": [["Арабика", "Coffea arabica", "Часто сложная ароматика: фрукты, ягоды, цветы, шоколад, орехи. Обычно меньше кофеина."], ["Робуста", "Coffea canephora", "Часто плотное тело, выраженная горечь, шоколадные, древесные, землистые оттенки. Обычно больше кофеина."]]}, {"type": "p", "text": "Арабика не обязательно лучше робусты: хорошая робуста бывает интересной, а плохая арабика — невкусной. Многое решают выращивание, обработка и обжарка."}, {"type": "note", "text": "Арабика — вид, а не сорт. Внутри него есть разновидности: Typica, Bourbon, Caturra, Geisha и другие."}]}, {"id": "history", "title": "История", "blocks": [{"type": "timeline", "items": [["Легенда", "Пастух Калди заметил, что его козы становились необычайно энергичными после красных ягод неизвестного растения. Красивая история, но исторических доказательств у неё нет."], ["Эфиопия", "Родиной кофейного растения арабика считается Эфиопия."], ["XV век, Йемен", "Кофе уже пьют в Йемене, где складываются ранние традиции выращивания и приготовления."], ["XVII век, Европа", "Из Ближнего Востока кофе приходит в Европу. Кофейни открываются в Лондоне, Париже, Вене и становятся местом встреч торговцев, учёных, писателей и политиков."]]}, {"type": "note", "text": "Слово «мокко» связано с йеменским портом Моха — важным центром кофейной торговли. Изначально оно не означало кофе с шоколадом."}]}, {"id": "geo", "title": "География", "blocks": [{"type": "p", "text": "Кофе растёт в тропиках между Северным и Южным тропиками — это кофейный пояс Земли. Крупнейшие производители — Бразилия и Вьетнам; заметную роль играют Колумбия, Индонезия и Эфиопия."}, {"type": "cards", "items": [["Бразилия", "Крупнейший производитель", "Шоколадные, ореховые, карамельные ноты. Часто идёт на эспрессо."], ["Эфиопия", "Родина арабики", "Иргачеффе, Сидамо, Харрар. Яркие цветочные, цитрусовые и ягодные ароматы."], ["Колумбия", "Горная арабика", "Фруктовые оттенки, карамельная сладость, сбалансированная кислотность."], ["Вьетнам", "Робуста", "Один из главных производителей робусты. Своя кофейная культура — например, кофе со сгущённым молоком."], ["Индонезия", "Суматра, Ява, Сулавеси", "Плотное тело, пряные, травяные и землистые оттенки."], ["Кения", "Яркая кислотность", "Ягоды, чёрная смородина, цитрусовые."]]}, {"type": "note", "text": "География даёт подсказку, но не гарантирует вкус: на одной плантации получают совсем разный кофе в зависимости от обработки."}]}, {"id": "process", "title": "Обработка", "blocks": [{"type": "p", "text": "После сбора ягоды обрабатывают, чтобы получить зелёные зёрна. Здесь закладывается значительная часть будущего вкуса."}, {"type": "cards", "items": [["Мытая", "Washed", "Снимают кожицу и мякоть, убирают остатки слизистого слоя и сушат семена. Чистый вкус, прозрачная ароматика, заметная кислотность."], ["Натуральная", "Natural", "Ягоды сушат целиком, оболочки снимают после сушки. Насыщенные фруктовые, ягодные и сладкие оттенки."], ["Хани", "Honey", "Кожицу снимают, но часть липкого слизистого слоя оставляют при сушке. Сладость и фруктовость при довольно чистом профиле. Мёд не используется."]]}, {"type": "note", "text": "Есть и экспериментальные методы с контролируемой ферментацией: дают необычные ароматы, но требуют точной технологии."}]}, {"id": "roast", "title": "Обжарка", "blocks": [{"type": "p", "text": "Зелёные зёрна почти не пахнут кофе. Аромат появляется при обжарке, когда под действием температуры идут сложные химические реакции."}, {"type": "cards", "items": [["Светлая", "Light", "Чаще сохраняет выраженную кислотность, фруктовые и цветочные оттенки."], ["Средняя", "Medium", "Баланс сладости, кислотности и жареных нот."], ["Тёмная", "Dark", "Усиливает горечь, жареные, карамельные и дымные оттенки."]]}, {"type": "note", "text": "Миф: чем темнее кофе, тем больше кофеина. Степень обжарки сама по себе не определяет кофеин в чашке — гораздо важнее вид кофе, количество зерна и рецепт."}]}, {"id": "brew", "title": "Приготовление", "blocks": [{"type": "p", "text": "Одно и то же зерно совершенно по-разному раскрывается в зависимости от способа приготовления."}, {"type": "cards", "items": [["Эспрессо", "Под давлением", "Небольшой концентрированный напиток: насыщенный вкус, плотная текстура."], ["Фильтр / V60", "Пролив через бумагу", "Вода проходит через молотый кофе и бумажный фильтр. Лёгкая текстура, хорошо различимые ароматы."], ["Френч-пресс", "Настаивание", "Кофе настаивается в горячей воде, гущу отделяет металлический фильтр. Более плотное тело."], ["По-турецки", "Джезва", "Очень мелкий помол, напиток не фильтруют — часть частиц остаётся в чашке."], ["Cold Brew", "Холодная экстракция", "Долгая экстракция холодной водой или водой комнатной температуры. Мягкий, округлый вкус."]]}, {"type": "h", "text": "Капучино, латте, флэт уайт"}, {"type": "table", "head": ["Напиток", "Характеристика"], "rows": [["Капучино", "Эспрессо, молоко и заметный слой молочной пены"], ["Латте", "Больше молока, мягкий кофейный вкус"], ["Флэт уайт", "Меньше объём, выше концентрация кофейного вкуса, тонкая микропена"]]}, {"type": "note", "text": "Единых рецептов для всех кофеен нет: объёмы и пропорции различаются."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "В профессиональной индустрии кофе оценивают каппингом — сравнительной дегустацией, где все образцы готовят по одинаковому протоколу."}, {"type": "table", "head": ["Характеристика", "Что оцениваем"], "rows": [["Аромат", "Цветы, ягоды, шоколад, орехи, специи"], ["Кислотность", "Яркость и свежесть вкуса"], ["Сладость", "Естественную сладость кофе без сахара"], ["Тело", "Плотность и текстуру напитка"], ["Горечь", "Её интенсивность и качество"], ["Послевкусие", "Ощущения после глотка"], ["Баланс", "Гармоничность всех характеристик"]]}, {"type": "p", "text": "Эфиопский кофе может напоминать чай с жасмином и цитрусом, а бразильский — шоколад с орехами."}, {"type": "note", "text": "«Клубника», «персик», «карамель» на упаковке — вкусовые ассоциации, а не добавленные ингредиенты."}, {"type": "h", "text": "Specialty Coffee"}, {"type": "p", "text": "Спешелти — кофе, который ценят за отличительные качества. Раньше его определяли по дегустационной оценке — от 80 баллов из 100. Сегодня Specialty Coffee Association смотрит шире: на свойства продукта и его ценность, а не только на один балл. Это повышенное внимание к происхождению, сырью, обработке, обжарке и приготовлению."}, {"type": "note", "text": "Спешелти не обязательно вкуснее лично для вас: любитель плотного горьковатого эспрессо может предпочесть классическую смесь яркой фруктовой арабике."}, {"type": "h", "text": "Практика: три образца"}, {"type": "table", "head": ["Образец", "Что ищем"], "rows": [["Бразилия · арабика средней обжарки", "Шоколад, орехи, карамель"], ["Эфиопия · арабика светлой обжарки", "Цветы, ягоды, цитрус"], ["Робуста", "Тело, горечь и насыщенность в сравнении с первыми двумя"]]}, {"type": "p", "text": "Готовьте все образцы одним методом и с одинаковым соотношением кофе и воды. Спросите команду: какой ароматнее, кислотнее, горше — и какой они захотели бы пить каждый день."}]}, {"id": "caffeine", "title": "Кофеин", "blocks": [{"type": "p", "text": "Кофеин — природный стимулятор: временно уменьшает сонливость и повышает бодрость. Сколько его в чашке, зависит от рецепта: эспрессо концентрированнее фильтра, но большая кружка фильтра может содержать больше кофеина суммарно."}, {"type": "table", "head": ["Ориентир EFSA для здоровых взрослых", "Количество"], "rows": [["Разовая доза", "до 200 мг"], ["Всего за день", "до 400 мг"], ["При беременности, из всех источников", "до 200 мг в день"]]}, {"type": "note", "text": "Это не индивидуальная рекомендация: чувствительность к кофеину разная, а некоторые заболевания и лекарства требуют дополнительных ограничений. Кофеин может ухудшать сон, особенно если пить кофе ближе к вечеру."}, {"type": "h", "text": "Интересные факты"}, {"type": "olist", "items": ["Кофе без кофеина всё равно может содержать немного кофеина — декофеинизация удаляет большую часть, но не обязательно весь.", "Молоко разбавляет напиток, но не уничтожает кофеин.", "«Крепость» кофе может означать разное: насыщенность вкуса, концентрацию растворённых веществ или количество кофеина.", "Высокая кислотность — не обязательно недостаток: в хорошем кофе она напоминает сочность яблока, ягод или цитруса.", "Кофе стареет после обжарки: летучие ароматы теряются, поэтому важны свежесть и хранение."]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "table", "head": ["Тема", "Главное"], "rows": [["Родина арабики", "Эфиопия"], ["Исторический центр торговли", "Йемен"], ["Что такое зерно", "Семя кофейного плода"], ["Основные виды", "Арабика и робуста"], ["Крупные производители", "Бразилия, Вьетнам, Колумбия, Индонезия, Эфиопия"], ["Обработка", "Washed, Natural, Honey"], ["Обжарка", "Светлая, средняя, тёмная"], ["Приготовление", "Эспрессо, фильтр, френч-пресс, джезва, Cold Brew"], ["Дегустация", "Аромат, кислотность, сладость, тело, горечь, послевкусие"], ["Главная идея", "Вкус зависит от происхождения, обработки, обжарки и приготовления"]]}, {"type": "quiz", "q": "Гость просит «самый крепкий, тёмной обжарки — там же больше кофеина». Так ли это?", "a": "Нет. Степень обжарки сама по себе не определяет кофеин — важнее вид кофе (робуста обычно кофеиновее), количество зерна и рецепт."}, {"type": "quiz", "q": "Почему на пачке написано «клубника», если клубники там нет?", "a": "Это вкусовые ассоциации от природных ароматических веществ кофе, а не добавленные ингредиенты."}, {"type": "quiz", "q": "Чем натуральная обработка отличается от мытой по вкусу?", "a": "Natural — ягоды сушат целиком, вкус насыщенно фруктовый и сладкий. Washed — чище, прозрачнее, с заметной кислотностью."}, {"type": "quiz", "q": "Что значит «мокко» исторически?", "a": "Название связано с йеменским портом Моха — центром кофейной торговли, а не с шоколадом."}, {"type": "p", "text": "Хороший кофе — не обязательно самый дорогой, крепкий или горький. Это качественно приготовленный напиток, вкус которого вам действительно нравится."}]}], "cover": "img/mvxuxcai.jpg"}];

function filterKitchen(){
  const q = kQuery.trim().toLowerCase(); let shown = 0;
  K.forEach((g,gi)=>{
    let n = 0;
    g.items.forEach((it,ii)=>{
      const el = document.getElementById(`k-${gi}-${ii}`);
      if(q.length>=2 && !kitchenSearchText.has(it)){
        kitchenSearchText.set(it, [it.name,it.serve,it.desc,it.comp.join(" "),it.dops,it.allerg].join(" ").toLowerCase());
      }
      const okQ = q.length<2 || kitchenSearchText.get(it).includes(q);
      const okA = !alSel.length || !hits(it, alSel).length;
      el.hidden = !(okQ && okA); if(!el.hidden) n++;
    });
    const sec = document.getElementById("grp-"+gi); sec.hidden = !n && !(A.on && q.length<2 && !alSel.length);
    sec.querySelector("h2 small").textContent = n; shown += n;
    document.querySelector(`.jump [data-jump="${gi}"]`).hidden = !n;
  });
  const active = q.length>=2 || alSel.length;
  document.getElementById("kcount").textContent = active ? `Подходит блюд: ${shown} из ${kCountF()}` : `${kCountF()} ${plural(kCountF(),"блюдо","блюда","блюд")} в меню`;

}

function barMenu(k, sid, gi, ii){

function renderBar(){
  const M = SETS[kind];
  const box = document.getElementById("bwrap"); const q = bQuery[kind].trim().toLowerCase();
  const modeTabs = document.querySelectorAll("[data-mode]"); modeTabs.forEach(b=>b.hidden = q.length>=2);
  if (q.length >= 2){
    const found = [];
    M.forEach(sh=>sh.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
      if(!barSearchText.has(it)){
        const name = [it.name,it.alt].filter(Boolean).join(" ").toLowerCase();
        const text = [name,...it.chips.map(c=>c[1]),...it.tags,...it.long.map(f=>f[1])].join(" ").toLowerCase();
        barSearchText.set(it, { name, text });
      }
      const {name,text} = barSearchText.get(it);
      if(text.includes(q)) found.push({sh,g,gi,ii,it,top:name.includes(q)});
    })));
    found.sort((a,b)=>b.top-a.top);
    const enc = kind==="strong" ? encHits(q) : "";
    box.innerHTML = `<p class="count">Найдено в ассортименте: ${found.length}</p>` + (found.length
      ? found.map((x,i)=>`<div class="ok-grp">${M.length>1?esc(x.sh.title)+" · ":""}${esc(x.g.title)}</div>${barItemHTML(x.it,"s",i,"bs")}`).join("")
      : `<p class="empty">В ассортименте ничего не нашлось по запросу «${esc(bQuery[kind])}».</p>`) + enc;
    applyStop(); return;
  }
  if (kind==="strong" && encMode==="enc"){ box.innerHTML = encGrid(); return; }
  const sh = M.find(x=>x.id===bSheet[kind]);
  box.innerHTML = `${M.length>1?`<div class="tabs" role="tablist" style="margin-top:12px">${M.map(x=>`<button class="tab" role="tab" type="button" aria-selected="${x.id===sh.id}" data-menu="${x.id}">${esc(x.title)}</button>`).join("")}</div>`:""}
  ${sh.groups.length>1?`<div class="jump">${sh.groups.map((g,i)=>`<button type="button" data-jump="${i}">${esc(g.title)}</button>`).join("")}</div>`:""}
  ${sh.groups.map((g,i)=>`<section class="grp" id="grp-${i}"><h2>${esc(g.title)}<small>${g.items.length}</small></h2>${groupAdmin(sh.id,i)}${g.items.map((it,j)=>barItemHTML(it,i,j)).join("")}</section>`).join("")}${addGroupBtn(sh.id)}`;
  const t = box.querySelector('.tab[aria-selected="true"]');
  if(t){
    const tabs = t.parentElement, frame = tabs.getBoundingClientRect(), button = t.getBoundingClientRect();
    if(button.left < frame.left || button.right > frame.right){
      tabs.scrollLeft += button.left - frame.left - (frame.width - button.width)/2;
    }
  }
  applyStop();
}

    case "olist": return `<ol class="olist">${b.items.map(i=>`<li><span>${esc(i)}</span></li>`).join("")}</ol>`;
    case "steps": return `<ol class="steps">${b.items.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></li>`).join("")}</ol>`;

    case "cards": return `<div class="cards">${b.items.map(c=>`<div class="card"><div class="ch"><b>${esc(c[0])}</b>${c[1]?`<span class="chip">${esc(c[1])}</span>`:""}</div><p>${esc(c[2])}</p></div>`).join("")}</div>`;

    case "cocktails": return `<div class="cards">${b.items.map(c=>cocktail(c)).join("")}</div>`;
    case "quiz": return `<div class="quiz"><span class="eyebrow">Вопрос</span><div class="q">${esc(b.q)}</div><button type="button" data-reveal>Показать ответ</button><div class="a" hidden>${esc(b.a)}</div></div>`;
    case "photo": return b.src ? `<figure class="ph"><img src="${esc(barImg(b.src))}" alt="${esc(b.caption||"")}" loading="lazy">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>` : "";
    case "picker": return `<div class="picker">
      <div class="pk-legend"><span class="role ap">Аперитив</span><span class="role dg">Дижестив</span><span class="role both">Обе роли</span></div>

    </div>`;
  }
  return "";
}

// ---------- Стоп-лист приходит от бота прямо в ссылке: ?s=12.40.131 (номера позиций меню) &t=… (вписано вручную)
const normName = s => String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[«»"'`.,!?()\-–—/]/g," ").replace(/\s+/g," ").trim();
let STOP = new Set(), stopNames = [];
function allNames(){
  const out = [];
  K.forEach(g=>g.items.forEach(it=>out.push(it.name)));
  ALL.forEach(s=>s.groups.forEach(g=>g.items.forEach(it=>out.push(it.name))));
  return out;
}
function loadStop(){
  try{
    const q = new URLSearchParams(location.search), names = allNames(), set = new Set(), extra = [];
    const ids = new Set((q.get("s")||"").split(".").filter(x=>/^\d+$/.test(x)).map(Number));
    K.forEach(g=>g.items.forEach(it=>{ if(ids.has(it.bid)) set.add(it.name); }));
    ALL.forEach(s=>s.groups.forEach(g=>g.items.forEach(it=>{ if(ids.has(it.bid)) set.add(it.name); })));
    (q.get("t")||"").split("|").map(x=>x.trim()).filter(Boolean).forEach(entry=>{
      const e = normName(entry); if(e.length<2) return;
      const exact = names.filter(n=>normName(n)===e);
      const hits = exact.length ? exact : names.filter(n=>normName(n).includes(e));
      if(hits.length) hits.forEach(n=>set.add(n)); else extra.push(entry);
    });
    STOP = set; stopNames = [...set, ...extra];
  }catch(e){ STOP = new Set(); stopNames = []; }
  applyStop();
}
function applyStop(){
  document.querySelectorAll("details.item[data-name]").forEach(el=>{
    const on = STOP.has(el.dataset.name); el.classList.toggle("stop", on);
  });
  document.querySelectorAll("[data-drink-name]").forEach(el=>el.classList.toggle("stop", STOP.has(el.dataset.drinkName)));
  const b = document.getElementById("stopbar");
  if(b){ b.hidden = !stopNames.length; b.innerHTML = stopNames.length ? `<b>В стопе сейчас</b><span>${stopNames.map(esc).join(" · ")}</span>` : ""; }
}

function distract(correct, pool, n=3){

  for(const x of shuffle(pool)){ const k=normName(x); if(!x||seen.has(k)) continue; seen.add(k); out.push(x); if(out.length===n) break; }

}
