<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шпаргалка официанта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik+Spray+Paint&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>

/* Layout: «нашивка» — чёрное полотно, кремовые карточки-патчи с оранжевой строчкой; одна колонка под телефон */
:root{
  --bg:#0c0b0a;          /* чёрная ткань логотипа */
  --surface:#171513;
  --surface-2:#211e1b;
  --cream:#ede3d3;       /* кремовый круг */
  --cream-ink:#1a1714;
  --fg:#f1e9dc;
  --muted:#a89e90;
  --line:#3a342e;
  --orange:#ee5a24;      /* строчка и надпись */
  --orange-soft:#ee5a2422;
  --font-display:"Russo One","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(45deg,#ffffff03 0 2px,transparent 2px 5px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;min-height:58px}
.top-word{height:36px;width:auto;flex:none;display:block}
.top-title.top-sub{margin-left:auto;text-align:right;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top-title{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;line-height:1.1;min-width:0}
.top-title small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);letter-spacing:0;font-weight:500}
.back{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--orange);display:grid;place-items:center;flex:none;color:var(--orange)}
.back svg{width:18px;height:18px}

/* Главная */
.hero{display:grid;justify-items:center;text-align:center;gap:6px;padding-block:20px 8px}
.hero-cat{width:min(240px,62vw);transform:rotate(-4deg);filter:drop-shadow(0 10px 18px #0009);transition:transform .3s}
.hero-cat:hover{transform:rotate(0deg) scale(1.02)}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(24px,7vw,32px);line-height:1.1;margin:8px 0 0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.sec-label{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-label::after{content:"";flex:1;border-top:1.5px dashed var(--line)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.patch{position:relative;text-align:left;background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:14px 14px 16px;
  box-shadow:0 0 0 2px var(--cream),0 0 0 4px var(--cream-ink),inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange);
  display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s}
.patch:active{transform:scale(.97)}
.grid .patch:last-child:nth-child(odd){grid-column:span 2;min-height:120px}
.patch .num{font-family:var(--font-display);font-size:13px;color:var(--orange)}
.patch .nm{font-family:var(--font-display);font-size:21px;line-height:1.05}
.patch .en{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6b6157}
.patch .tg{font-size:13px;line-height:1.35;color:#3d362f;margin-top:auto}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qbtn{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:2px}
.qbtn b{font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--orange)}
.qbtn span{font-size:13px;color:var(--muted)}

/* Страница напитка */
.sp-head{padding-block:18px 4px}
.sp-head h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,9vw,42px);line-height:1;margin:4px 0 6px}
.sp-head p{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:var(--surface);border-radius:12px;padding:10px;min-width:0}
.fact span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{font-weight:600;font-size:14px;line-height:1.25;display:block;margin-top:2px;overflow-wrap:anywhere}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;border:1.5px dashed var(--line);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);border-style:solid;color:#fff}

.content{display:grid;gap:14px;padding-top:18px}
.content h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin:10px 0 0;color:var(--cream);text-wrap:balance}
.content p{margin:0;max-width:65ch}
.lead{font-size:18px;line-height:1.5;color:var(--cream);font-weight:500}
.note{background:var(--orange-soft);border:1.5px dashed var(--orange);border-radius:14px;padding:12px 14px;font-size:15px}
.note::before{content:"Важно";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
ul.list,ol.olist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.list li{position:relative;padding-left:20px}
ul.list li::before{content:"";position:absolute;left:3px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--orange)}
ol.olist{counter-reset:o}
ol.olist li{counter-increment:o;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
ol.olist li::before{content:counter(o);width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--orange);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;color:var(--orange)}

.steps{display:grid;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:19px;top:42px;bottom:2px;border-left:2px dashed var(--line)}
.steps .n{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--cream-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:15px;box-shadow:inset 0 0 0 2.5px var(--cream),inset 0 0 0 4px var(--orange)}
.steps b{display:block;font-size:16px;margin-top:8px}
.steps p{color:var(--muted);font-size:15px}

.cards{display:grid;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:4px;border:1px solid var(--line)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card b{font-size:17px;color:var(--cream)}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--orange-soft);color:var(--orange);white-space:nowrap}
.card p{color:var(--muted);font-size:15px}

.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;vertical-align:top}
th{background:var(--surface-2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:600}
tr+tr td{border-top:1px solid var(--line)}
td:first-child{font-weight:600;color:var(--cream);min-width:7.5em}

.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:14px;padding-bottom:16px;position:relative}
.tl li::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--orange);margin-top:5px;box-shadow:0 0 0 4px var(--orange-soft)}
.tl li:not(:last-child)::after{content:"";position:absolute;left:6px;top:22px;bottom:0;border-left:2px dashed var(--line)}
.tl b{display:block;font-family:var(--font-display);font-weight:400;color:var(--orange);font-size:15px}
.tl p{color:var(--fg);font-size:15px}

.ck{background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:16px;display:grid;gap:8px;box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange)}
.ck .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ck b{font-family:var(--font-display);font-weight:400;font-size:20px}
.ck .base{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.ck p{color:#3d362f;font-size:15px}
.ck ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.ck li{display:flex;gap:8px}
.ck li::before{content:"—";color:var(--orange);font-weight:700}
.ck .how{font-size:14px;color:#5a5047;border-top:1.5px dashed #c9bba5;padding-top:8px}

.quiz{background:var(--surface);border:1.5px dashed var(--orange);border-radius:16px;padding:16px;display:grid;gap:10px}
.quiz .q{font-weight:600;color:var(--cream)}
.quiz button{justify-self:start;background:var(--orange);color:#fff;font-weight:600;padding:9px 16px;border-radius:999px}
.quiz .a{color:var(--fg)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.filters::-webkit-scrollbar{display:none}

.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px dashed var(--orange);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;margin-top:18px}
.search::placeholder{color:var(--muted)}
.res{display:grid;gap:10px;margin-top:14px}
.hit{background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:4px;border:1px solid var(--line)}
.hit .where{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.hit .snip{font-size:14px;color:var(--muted)}
.hit b{color:var(--cream);font-size:16px}
.hit mark{background:var(--orange-soft);color:var(--cream);border-radius:3px;padding:0 2px}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{flex:1;padding:12px;border-radius:14px;border:1.5px dashed var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.pager button:last-child{text-align:right}
.pager button.go{border-color:var(--orange);color:var(--orange)}

/* Нижняя панель */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1.5px dashed var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:10px 4px 12px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--orange)}
/* Выбор примера: аперитив / дижестив */
:root{--ap:#7fc4a0;--dg:#c99bd8}
.picker{display:grid;gap:12px}
.pk-legend{display:flex;gap:6px;flex-wrap:wrap}
.role{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.role.ap{background:#7fc4a022;color:var(--ap)}
.role.dg{background:#c99bd822;color:var(--dg)}
.role.both{background:var(--orange-soft);color:var(--orange)}
.pk-chips{display:flex;flex-wrap:wrap;gap:8px}
.pk{padding:8px 13px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.pk.role-ap{border-left:4px solid var(--ap)}
.pk.role-dg{border-left:4px solid var(--dg)}
.pk.role-both{border-left:4px solid var(--orange)}
.pk[aria-pressed="true"]{background:var(--cream);color:var(--cream-ink);border-color:var(--cream)}
.pk-card{background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:16px;display:grid;gap:8px;box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange)}
.pk-card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pk-card b{font-family:var(--font-display);font-weight:400;font-size:22px}
.pk-card p{color:#3d362f;margin:0}
.pk-card .role.ap{background:#2e7a52;color:#fff}.pk-card .role.dg{background:#7a4a8c;color:#fff}.pk-card .role.both{background:var(--orange);color:#fff}
.inbar{font-size:14px;color:#3d362f;border-top:1.5px dashed #c9bba5;padding-top:8px}
.inbar span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}

/* Меню бара */
.menu-cta{width:100%;text-align:left;background:var(--orange);color:#fff;border-radius:18px;padding:16px 18px;display:grid;gap:2px;
  box-shadow:inset 0 0 0 3px var(--orange),inset 0 0 0 4.5px #fff8;transition:transform .15s}
.menu-cta:active{transform:scale(.98)}
.menu-cta b{font-family:var(--font-display);font-weight:400;font-size:22px}
.menu-cta span{font-size:14px;opacity:.9}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.jump button{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.grp{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px);display:grid;gap:10px;margin-top:22px}
.grp h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0;color:var(--cream);display:flex;align-items:baseline;gap:10px}
.grp h2 small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:500}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}
.item[open]{border-color:var(--orange);border-style:dashed}
.item summary{list-style:none;cursor:pointer;padding:13px 14px;display:grid;gap:5px}
.item summary::-webkit-details-marker{display:none}
.it-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.it-top b{font-size:17px;color:var(--cream);line-height:1.25;min-width:0;overflow-wrap:anywhere}
.abv{flex:none;font-family:var(--font-display);font-size:14px;color:var(--orange);font-variant-numeric:tabular-nums}
.alt,.maker{font-size:13px;color:var(--muted);line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tags span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--orange-soft);color:var(--orange)}
.more{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item[open] .more{color:var(--orange)}
.it-body{padding:0 14px 14px;display:grid;gap:12px;border-top:1.5px dashed var(--line);padding-top:12px;margin:0 0 0}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.spec{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.spec span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spec b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.fld span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
.fld p{margin:0;font-size:15px;white-space:pre-line;max-width:65ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- приложение официанта --- */
.hero.compact{grid-template-columns:auto 1fr;justify-items:start;text-align:left;align-items:center;gap:14px;padding-block:16px 0}
.hero.compact .hero-cat{width:96px}
.hero.compact h1{font-size:clamp(22px,6vw,28px);margin:2px 0 4px}
.hero.compact p{max-width:none}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--orange);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.jump.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:14;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.jump.sticky::-webkit-scrollbar{display:none}
.jump button{flex:none}
.serve{font-size:13px;color:var(--muted)}
.tags span.al{background:#ffffff0d;color:var(--fg);border:1px solid var(--line)}
.sell{background:var(--cream);color:var(--cream-ink);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 2.5px var(--cream),inset 0 0 0 4px var(--orange)}
.sell span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
.sell p{margin:0;font-size:15px;line-height:1.45}
.fld ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.fld li{position:relative;padding-left:16px}
.fld li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.warn{background:var(--orange-soft);border:1.5px dashed var(--orange);border-radius:14px;padding:10px 12px;font-size:15px}
.warn span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:4px}
.warn ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.al-box{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.al-box span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.al-box p{margin:0;font-size:15px}
.pk-chips .pk[aria-pressed="true"]{background:var(--orange);color:#fff;border-color:var(--orange)}
.res-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px;gap:10px}
.res-head b{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--cream)}
.res-head span{font-size:13px;color:var(--muted)}
.ok-list{display:grid;gap:8px}
.ok{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left;display:grid;gap:3px}
.ok b{color:var(--cream);font-size:16px}
.ok small{font-size:12px;color:var(--muted)}
.ok-grp{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:14px 0 2px}
.hit.no{opacity:.55}
.nav-in{grid-template-columns:repeat(4,1fr)}
.nav button{font-size:12px}
/* стоп-лист */
.stopmark{display:none;flex:none;font-size:11px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:6px;background:#d93a2b;color:#fff;align-self:center}
.item.stop .stopmark{display:inline-block}
.item.stop summary b{text-decoration:line-through;text-decoration-color:#d93a2b;opacity:.7}
.it-top{align-items:center}
.stopbar{margin-top:14px;background:#d93a2b1f;border:1.5px solid #d93a2b;border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.stopbar b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ff6b5a}
.stopbar span{font-size:14px;line-height:1.4}
/* пары */
.pairs{display:grid;gap:8px}
.pairs>span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.pair{text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.pair b{font-size:15px;color:var(--cream)}
.pair small{font-size:13px;color:var(--muted);line-height:1.35}
.pair.stop{opacity:.5}
.pair.stop b::after{content:" · стоп";color:#ff6b5a;font-size:12px}
/* тренажёр */
.qz-topics{display:grid;gap:10px;margin-top:18px}
.qz-topics .qbtn em{font-style:normal;font-size:12px;color:var(--fg);margin-top:4px}
.qz-top{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}
.qz-score{font-size:13px;color:var(--muted)}
.qz-bar{height:6px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.qz-q{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.25;margin:18px 0 14px;color:var(--cream)}
.qz-opts{display:grid;gap:8px}
.qz-o{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;color:var(--fg)}
.qz-o.right{border-color:#4caf7a;background:#4caf7a22;color:var(--cream)}
.qz-o.wrong{border-color:#d93a2b;background:#d93a2b22}
.qz-o:disabled{cursor:default}
.qz-fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:15px}
.qz-fb.ok{background:#4caf7a1f;border:1.5px dashed #4caf7a}
.qz-fb.no{background:#d93a2b1f;border:1.5px dashed #d93a2b}
.qz-fb p{margin:4px 0 0;color:var(--fg)}
.qz-next{width:100%;margin-top:14px;background:var(--orange);color:#fff;font-weight:600;font-size:16px;padding:14px;border-radius:14px}
.qz-actions{display:grid;gap:10px;margin-top:4px}
.nav button{font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.filt{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;margin-top:10px}
.filt[open]{border-color:var(--orange)}
.filt summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.filt summary::-webkit-details-marker{display:none}
.filt summary em{font-style:normal;font-size:13px;color:var(--orange)}
.filt .in{padding:0 14px 14px;display:grid;gap:12px}
.filt .note{font-size:13px}
.count{font-size:13px;color:var(--muted);margin-top:10px}
.search{margin-top:14px}



/* фото позиций */
.it-photo.fit{object-fit:contain;background:#fff;height:300px;width:100%;aspect-ratio:auto}
.it-top .thumb + b{flex:1;text-align:left}
.it-top .thumb{flex:none;width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--surface-2);order:-1;margin-right:2px}
.it-photo{display:block;width:100%;max-height:340px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--surface-2)}
/* режим администратора (как в барном приложении) */
.abar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:26;background:var(--orange);color:#fff}
.abar-in{max-width:640px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px}
.abar .ab-t{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.25}
.abar button{background:#fff;color:#b8400f;font-weight:700;font-size:14px;padding:8px 13px;border-radius:999px;flex:none}
.abar button.ghost{background:transparent;color:#fff;border:1.5px solid #ffffffaa}
.abar button:disabled{opacity:.55}
body.admin .wrap{padding-bottom:160px}
.add-row{display:flex;gap:6px;flex-wrap:wrap}
.add-row button{font-size:14px;font-weight:700;padding:10px 14px;border-radius:999px;border:1.5px dashed var(--orange);color:var(--orange);background:transparent}
.item-admin{display:flex;gap:6px;flex-wrap:wrap}
.item-admin button{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.grp-admin{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.grp-admin button{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.sheet-bg{position:fixed;inset:0;z-index:50;background:#1f1a1780;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;border-radius:20px 20px 0 0;border-top:2px dashed var(--orange);
  padding:18px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.sheet h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--ink)}
.sheet label{display:grid;gap:5px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet input:not([type=file]):not([type=checkbox]),.sheet textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;text-transform:none;letter-spacing:0;font-weight:400}
.sheet textarea{min-height:150px;resize:vertical;line-height:1.45}
.sheet label.chk{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--fg)}
.sheet .hint{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.sheet .hint code{background:var(--bg);padding:1px 5px;border-radius:5px;color:var(--ink)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet .row button{padding:11px 18px;border-radius:999px;font-weight:700}
.btn-main{background:var(--orange);color:#fff}
.btn-main:disabled{opacity:.6}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink)}
.btn-del{color:#c0392b;border:1.5px solid #c0392b66;margin-right:auto}
.btn-del.sure{background:#c0392b;color:#fff;border-color:#c0392b}
.photo-pick{display:grid;gap:8px}
.photo-pick img{max-height:220px;width:100%;object-fit:cover;border-radius:12px}
.photo-pick .pp-btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-pick .pp-btns label,.photo-pick .pp-btns button{font-size:14px;font-weight:700;padding:9px 14px;border-radius:999px;border:1.5px dashed var(--orange);color:var(--orange);text-transform:none;letter-spacing:0;display:inline-block;cursor:pointer;background:transparent}
.photo-pick input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.fpair{display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.fpair .fp-h{display:flex;gap:6px}
.fpair .fp-h button{flex:none;font-size:13px;color:#c0392b;padding:0 8px}
.err{color:#c0392b;font-size:14px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:#fff;padding:10px 16px;border-radius:16px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px #0004}

.logo-tap{padding:0;margin:0;border:0;background:none;display:block;flex:none;line-height:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:default}
.logo-tap img{pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.top{touch-action:manipulation}
.ph{margin:0;display:grid;gap:6px}.ph img{width:100%;border-radius:14px;display:block}.ph figcaption{font-size:13px;color:var(--muted)}

/* плитки энциклопедии — как в барном приложении */
.enc-grid{gap:22px 12px}
.patch{position:relative;text-align:left;background:var(--cream);color:#1a1714;border-radius:16px;padding:0;overflow:visible;display:flex;flex-direction:column;min-width:0;transition:transform .15s;box-shadow:0 0 0 1.5px #e2d3bd,0 6px 16px #6b4a2a22!important}
.patch:active{transform:scale(.97)}
.patch .pt-photo{border-radius:16px 16px 0 0}
.pt-photo{position:relative;display:block;aspect-ratio:10/7;background:#1d1714;overflow:hidden}
.pt-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pt-ph{position:absolute;inset:0;background:radial-gradient(circle at 70% 35%,#ee5a2455,transparent 55%),radial-gradient(circle at 20% 90%,#7a3d1255,transparent 60%),linear-gradient(160deg,#2a211b,#120e0c)}
.pt-icon{position:absolute;left:10px;top:10px;width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px #000a)}
.pt-body{position:relative;display:flex;flex-direction:column;gap:2px;padding:20px 12px 13px;margin-top:-12px;background:var(--cream);flex:1;border-radius:0 0 16px 16px}
.pt-body::before{content:"";position:absolute;left:0;right:0;top:-9px;height:10px;background:var(--cream);clip-path:polygon(0 60%,4% 20%,9% 55%,14% 15%,20% 50%,26% 25%,31% 65%,37% 10%,43% 45%,49% 20%,55% 60%,61% 15%,67% 50%,73% 25%,79% 60%,85% 10%,91% 45%,96% 20%,100% 55%,100% 100%,0 100%)}
.patch .num{position:absolute;left:10px;top:-16px;background:var(--orange);color:#fff;font-family:var(--font-display);font-size:12px;letter-spacing:.02em;padding:4px 10px 3px;border-radius:9px 5px 10px 4px;transform:rotate(-5deg);box-shadow:0 2px 6px #0004}
.nm-row{display:flex;align-items:flex-end;gap:6px;min-width:0}
.patch .nm{font-family:"Rubik Spray Paint",var(--font-display);font-size:clamp(22px,6.8vw,28px);line-height:1.02;text-transform:uppercase;transform:skewX(-7deg);transform-origin:left bottom;overflow-wrap:normal;word-break:keep-all;min-width:0;color:#1a1714}
.patch .nm.mid{font-size:clamp(18px,5.4vw,23px)}
.patch .nm.long{font-size:clamp(15px,4.4vw,19px)}
.patch .nm.xlong{font-size:clamp(13px,3.7vw,16px)}
.patch .en{overflow-wrap:anywhere;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7a7066;margin-top:3px}
.patch .tg{font-size:12.5px;line-height:1.35;color:#2f2924;margin-top:5px}
.pt-stroke{flex:1 1 30px;min-width:14px;max-width:90px;height:12px;margin-bottom:3px;fill:none;stroke:var(--orange);stroke-width:3.2;stroke-linecap:round}
.pt-stroke path+path{stroke-width:1.8;opacity:.7}
.enc-grid > :last-child:nth-child(odd){grid-column:span 2}
.enc-grid > .patch:last-child:nth-child(odd) .pt-photo{aspect-ratio:2/1}
.sp-cover{width:100%;max-height:230px;object-fit:cover;border-radius:16px;margin-top:14px;display:block}


/* обучение и аттестация */
.lstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.lstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lstat span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lstat b{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--ink)}
.lstat b.ok{color:#2e8a5c}.lstat b.bad{color:#c8321f}
.lstat small{font-size:12px;color:var(--muted)}
.pbar{display:block;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.pbar u{display:block;height:100%;background:linear-gradient(90deg,#c9461a,var(--orange));border-radius:6px}
.sec-label{margin:22px 0 8px}
.lhint{margin:6px 0 10px;font-size:13px;color:var(--muted);line-height:1.45}
.ltopics{display:flex;flex-wrap:wrap;gap:8px}
.ltopics .tab,.ltabs .tab{margin:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .qbtn{margin:0}
.sj-cta{width:100%;text-align:left;margin-top:12px;background:var(--orange);color:#fff;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sj-cta b{font-family:var(--font-display);font-weight:400;font-size:20px}
.sj-cta span{font-size:13px;opacity:.92}
.lread{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1.2fr) 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.lrow span{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.read::after{content:" ✓";color:#2e8a5c}
.tab.read[aria-selected="true"]::after{color:#fff}
.lcount{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:14px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;margin-top:10px;box-shadow:0 2px 10px #6b4a2a12}
.lcard h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0;color:var(--ink);line-height:1.15}
.lc-img{width:100%;max-height:240px;object-fit:cover;border-radius:12px}
.lc-img.fit{object-fit:contain;background:#fff}
.lc-q{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.lsub{margin:-4px 0 14px;color:var(--ink);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45}
.lbtns{display:flex;gap:10px;margin-top:14px}
.lb{flex:1;padding:14px 12px;border-radius:999px;font-weight:700;font-size:15px;border:1.5px solid var(--line);color:var(--ink);background:var(--surface)}
.lb.main{background:var(--orange);border-color:var(--orange);color:#fff}
.lb.ok{border-color:#2e8a5c;color:#2e8a5c}.lb.bad{border-color:#c8321f;color:#c8321f}
.lsend{font-size:14px;margin:6px 0 0}
.lt-link{margin-top:6px;font-size:14px;font-weight:700;color:var(--orange);padding:0;background:none}
.lwrong{display:grid;gap:8px}
.lw{display:grid;gap:3px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.lw b{color:var(--ink)}.lw small{color:var(--muted)}
.lw .bad{color:#c8321f}.lw .ok{color:#2e8a5c}
.lname{display:grid;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lname input{font:500 16px var(--font-body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;letter-spacing:0;text-transform:none}
.ltop{display:grid;gap:8px}
.ltabs{display:flex;gap:8px;flex-wrap:wrap}
.lnote{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.ltlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ltlist li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ltlist li.me{border-color:var(--orange);background:#e2531d12}
.lpl{font-size:18px;text-align:center;color:var(--muted);font-weight:700}
.lnm{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnm small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ltlist b{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--orange)}
/* нет доступа */
body.locked .nav{display:none}
.lock{text-align:center;padding:40px 0 20px;display:grid;gap:12px;justify-items:center}
.lock-cat{width:140px}
.lock h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:28px;color:var(--ink)}
.lock p{margin:0;color:var(--muted);line-height:1.5}
.lock-id{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 20px}
.lock-id span{font-size:13px;color:var(--muted)}.lock-id b{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--ink);letter-spacing:.04em}
.lock .lb{flex:none;padding:12px 22px}
/* мем в конце теста */
.meme{position:relative;margin:16px 0 4px;border-radius:18px;overflow:hidden;height:300px;display:grid;place-items:center;isolation:isolate}
.meme.happy{background:radial-gradient(circle at 50% 60%,#ffe9a8,#ffb86b 70%,#ff8a4c)}
.meme.mid{background:radial-gradient(circle at 50% 60%,#fff1dc,#f4d2a8 75%)}
.meme.sad{background:linear-gradient(#8e9aab,#5f6b7d)}
.meme img{width:170px;height:170px;object-fit:contain;z-index:1;filter:drop-shadow(0 8px 10px #0004)}
.meme.happy img{animation:mm-jump 1s cubic-bezier(.3,.6,.4,1) infinite}
.meme.mid img{animation:mm-tilt 1.6s ease-in-out infinite}
.meme.sad img{filter:grayscale(.85) brightness(.9) drop-shadow(0 8px 10px #0005);animation:mm-sad 3s ease-in-out infinite;transform-origin:50% 100%}
.meme .cap{position:absolute;left:10px;right:10px;z-index:3;text-align:center;font:900 22px/1.1 Impact,"Arial Black","Russo One",sans-serif;text-transform:uppercase;color:#fff;letter-spacing:.02em;
  text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 2px 0 #000,2px 0 0 #000,0 -2px 0 #000,-2px 0 0 #000;text-wrap:balance}
.meme .cap.mtop{top:12px}.meme .cap.mbot{bottom:12px}
.meme .fx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.meme .fx i{position:absolute;top:-20px;display:block;font-style:normal}
.meme.happy .fx i{width:8px;height:12px;border-radius:2px;animation:mm-fall linear infinite}
.meme.sad .fx i{width:2px;height:14px;background:#d6e4f5;border-radius:2px;opacity:.8;animation:mm-rain linear infinite}
.meme.mid .fx i{top:auto;bottom:40px;font:700 24px/1 var(--font-display);color:#7c5a3a;animation:mm-q 2.4s ease-out infinite;opacity:0}
.meme .cloud{position:absolute;top:58px;left:50%;width:110px;height:34px;margin-left:-55px;background:#e4e9f0;border-radius:20px;z-index:2;animation:mm-cloud 3s ease-in-out infinite;box-shadow:0 4px 0 #c5cdd8}
.meme .cloud::before,.meme .cloud::after{content:"";position:absolute;background:#e4e9f0;border-radius:50%}
.meme .cloud::before{width:50px;height:50px;left:14px;top:-26px}.meme .cloud::after{width:38px;height:38px;left:52px;top:-18px}
@keyframes mm-jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-38px) rotate(-8deg)}55%{transform:translateY(-38px) rotate(8deg)}80%{transform:translateY(0) scale(1.06,.94)}}
@keyframes mm-tilt{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes mm-sad{0%,100%{transform:rotate(-3deg) translateY(6px)}50%{transform:rotate(3deg) translateY(10px)}}
@keyframes mm-fall{to{transform:translateY(340px) rotate(720deg)}}
@keyframes mm-rain{to{transform:translateY(340px)}}
@keyframes mm-q{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-140px) scale(1.2);opacity:0}}
@keyframes mm-cloud{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.meme *{animation:none!important}}

/* ===== светлая тема ===== */
:root{
  color-scheme:light;
  --bg:#faf6ef; --surface:#ffffff; --surface-2:#f4ede2;
  --cream:#fbefdc; --cream-ink:#2b2521;
  --fg:#2b2521; --muted:#7c7064; --line:#e7ddce; --ink:#1f1a17;
  --orange:#e2531d; --orange-soft:#e2531d1a;
  --ap:#2e8a5c; --dg:#8a4fa0;
  --stop:#c8321f;
}
body{background-image:repeating-linear-gradient(45deg,#7a5a3006 0 2px,transparent 2px 9px)}
.content h2,.lead,.card b,td:first-child,.quiz .q,.hit b,.hit mark,.grp h2,.it-top b,

.stopbar{background:#c8321f0f;border-color:var(--stop)}

.qz-fb.ok{background:#2e8a5c14;border-color:#2e8a5c}

/* Меню и обучение: общие размеры и состояния для мобильного экрана. */
:root{
  --bg:#f7f3ec; --surface:#fffdf9; --surface-2:#f0e9de;
  --ink:#231b17; --fg:#322821; --muted:#6e5e52; --line:#e4d9cb;
  --orange:#b83f1d; --orange-soft:#b83f1d12;
  --screen-width:700px; --top-height:56px;
}
body{background-image:none}
.wrap,.top-in,.nav-in,.abar-in{max-width:var(--screen-width)}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{background:var(--bg)}
.top-in{min-height:var(--top-height);padding-block:7px}
.top-word{height:31px}
.top-title.top-sub{font-size:12px;letter-spacing:.06em;text-transform:none}
.sp-head h1,.hero.compact h1{font-size:clamp(32px,8vw,46px);line-height:1.05;letter-spacing:-.035em}
.sp-head p,.hero.compact p{font-size:14px;line-height:1.5;color:var(--muted)}
.menu-head,.exam-head{
  margin-top:16px;border:1px solid #ead6c1;border-radius:22px;padding:18px 16px 16px;
  background:linear-gradient(120deg,#fffdf9 25%,#f6e5d3);text-align:left;
}
.menu-head .sp-head,.menu-head .hero.compact{padding:0}
.menu-head .hero.compact{grid-template-columns:minmax(0,1fr) auto;gap:8px}
.menu-head .hero-cat{width:clamp(58px,20vw,96px);order:1;transform:none;filter:none}
.menu-head .search{margin-top:14px}
.search-field{position:relative}
.search-field svg{position:absolute;top:50%;left:14px;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.menu-head .search-field{margin-top:14px}
.menu-head .search-field .search{margin:0}
.search{background:var(--surface);border:1px solid #d9cabc;border-radius:12px;padding:11px 13px;min-height:46px}
.search-field .search{padding-inline-start:41px}
.search:focus{border-color:var(--orange)}
.filt{border-style:solid}
.filt summary{min-height:44px}
.tabs,.jump.sticky{top:calc(env(safe-area-inset-top,0px) + var(--top-height));background:var(--bg);backdrop-filter:none}
.tabs{padding-block:8px}
.tab{padding:8px 13px;border:1px solid var(--line);min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.jump{gap:6px;flex-wrap:nowrap;overflow:auto;scrollbar-width:none;padding:2px 0 4px}
.jump::-webkit-scrollbar{display:none}
.jump button{min-height:38px;padding:6px 12px}
.count{margin-block:12px 4px;font-variant-numeric:tabular-nums}
.grp{gap:7px;margin-top:20px}
.grp h2{color:var(--ink);font-size:20px}
.grp h2 small{background:var(--surface-2);padding:1px 7px;border-radius:8px;font-variant-numeric:tabular-nums}
.item{border-radius:14px;box-shadow:none}
.item[open]{border:1px solid #d7a38e}
.item summary{position:relative;padding:11px 38px 11px 11px;display:flex;align-items:center;gap:10px;min-height:54px}
.item summary:focus-visible{border-radius:14px;outline-offset:-3px}
.item summary:has(.more)::after{
  content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border:solid var(--muted);
  border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg);
}
.item[open] summary::after{transform:translateY(-25%) rotate(225deg)}
.item .thumb{flex:none;width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--surface-2)}
.item .thumb.fit{object-fit:contain;background:#fff}
.it-summary{min-width:0;flex:1;display:grid;gap:3px}
.it-top{align-items:center;justify-content:flex-start;gap:6px;flex-wrap:wrap}
.it-top b{font-size:16px;line-height:1.25}
.it-top .abv{margin-inline-start:auto;font:700 12px var(--font-body)}
.tags{gap:4px}
.tags span{padding:2px 6px;font-size:11px;line-height:1.3}
.more{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.it-body{border-top:1px solid var(--line);padding:12px}
.item[open] .it-body{gap:14px}
.it-photo{border-radius:10px}
.sell{box-shadow:none;border:1px solid #e8d4b8}
.nav{border-top:1px solid var(--line)}
.nav-in{gap:4px;padding:5px 8px}
.nav button{font-size:12px;letter-spacing:0;text-transform:none;line-height:1.15;padding:5px 2px;min-height:50px;border-radius:11px}
.nav button[aria-current="page"]{background:var(--orange-soft);color:var(--orange);font-weight:700}
.nav button svg{width:20px;height:20px}
.abar{bottom:calc(61px + env(safe-area-inset-bottom,0px))}
.sj-cta{position:relative;margin-top:14px;padding:14px 44px 14px 16px;border-radius:15px}
.sj-cta::after{content:"→";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px}
.lstats{gap:8px}
.lstat{padding:10px 12px}
.qbtn{border-style:solid}
.lcard,.lb{border-radius:13px}
.exam-head{display:grid;gap:8px}
.exam-head h1{margin:0}
.exam-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 0}
.exam-facts div{display:flex;flex-direction:column-reverse;background:#fffaf3;border:1px solid #ead6c1;border-radius:11px;padding:8px 10px}
.exam-facts dt{font-size:12px;color:var(--muted)}
.exam-facts dd{margin:0;color:var(--ink);font:700 22px/1.2 var(--font-body)}
.qz-head{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:16px;padding:14px 15px}
.qz-top{margin:0;gap:8px}
.qz-top .eyebrow{letter-spacing:.04em}
.qz-q{font-size:clamp(20px,5.5vw,27px);line-height:1.2;margin:14px 0 0;overflow-wrap:anywhere}
.qz-head .lsub{margin:10px 0 0}
.qz-opts{margin-top:12px}
.qz-o{display:grid;grid-template-columns:25px minmax(0,1fr);gap:9px;align-items:start;min-height:52px;padding:11px 12px;overflow-wrap:anywhere}
.qz-key{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:var(--surface-2);font-size:12px;font-weight:700}
.qz-o.right .qz-key{background:#d7eadf;color:#185733}
.qz-o.wrong .qz-key{background:#f4d9d4;color:#8b251a}
.boot-status{margin:20px 0;color:var(--muted);font-size:14px}
@media(hover:hover){.item summary:hover,.qz-o:not(:disabled):hover,.jump button:hover{background:var(--surface-2)}}
@media(max-width:340px){.menu-head,.exam-head{padding:13px}.item .thumb{width:38px;height:38px}.filt summary{align-items:baseline}}

window.SPIRITS = [{"id": "gin", "num": "01", "name": "Джин", "en": "Gin", "tagline": "От голландского женевера до классики коктейлей", "facts": [["Мин. крепость", "37,5%"], ["Корни", "Нидерланды"], ["Главное", "Можжевельник"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Джин — крепкий алкогольный напиток, основным ароматическим компонентом которого является можжевельник. Именно он отличает джин от большинства других крепких напитков."}, {"type": "p", "text": "Внешне джин обычно прозрачен, но его аромат может быть совершенно разным: от выраженного хвойного и сухого до цитрусового, цветочного, пряного или даже землистого."}, {"type": "p", "text": "Согласно регламенту ЕС № 2019/787, минимальная крепость джина — 37,5% об. На практике встречаются продукты 40%, 43%, 47% и выше. Конкретная крепость зависит от продукта и рынка."}, {"type": "note", "text": "Джин — это не просто водка, в которую добавили можжевельник. У него есть собственные правила производства, ароматический профиль и несколько технологических категорий."}, {"type": "h", "text": "Родина джина"}, {"type": "p", "text": "Современный джин чаще всего связывают с Англией. Но истоки напитка — в Нидерландах и Бельгии."}, {"type": "p", "text": "Предшественник джина — женевер (jenever / genever). Это традиционный можжевеловый напиток, тесно связанный с зерновыми дистиллятами, с гораздо более выраженным солодовым вкусом, чем современный London Dry Gin."}, {"type": "note", "text": "Корректно говорить так: корни джина — в Нидерландах и соседних регионах, а Англия превратила его в самостоятельный и всемирно известный стиль."}]}, {"id": "history", "title": "История", "blocks": [{"type": "timeline", "items": [["Средние века", "Можжевельник используют в лечебных средствах, в Европе развивается перегонка спирта. Ранние можжевеловые напитки — ещё не джин, но часть традиции, из которой вырос женевер."], ["XVII век", "Женевер популярен в Нидерландах. Торговые связи голландцев и англичан приносят напиток в Англию."], ["1688", "Вильгельм Оранский становится английским королём. На фоне противостояния с Францией политика поощряет местные спиртные напитки, в том числе джин, вместо французского бренди."], ["Первая половина XVIII века", "Gin Craze — массовое распространение дешёвого джина в Англии, особенно в Лондоне. Причины: налоги, доступное зерно, ограничения на импорт бренди, слабый контроль."], ["1751", "Уильям Хогарт создаёт гравюру Gin Lane о последствиях пьянства. Закон 1751 года становится одной из ключевых мер борьбы с кризисом."], ["XIX–XX века", "Дистилляция улучшается, формируются узнаваемые стили, а с распространением коктейлей джин получает вторую жизнь."]]}, {"type": "note", "text": "Легенда: англичане «открыли» джин в Тридцатилетнюю войну, увидев бесстрашных голландских солдат. Надёжных оснований для этого нет — популярный рассказ, а не доказанный факт."}, {"type": "p", "text": "Сегодня джин используется и в классике, и в современных авторских напитках."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "p", "text": "Несмотря на огромное разнообразие брендов, базовая логика производства довольно понятна."}, {"type": "steps", "items": [["Подготовка спиртовой основы", "Используют этиловый спирт сельскохозяйственного происхождения: из пшеницы, ржи, ячменя, кукурузы и других культур."], ["Подготовка ботаникалов", "Главный компонент — ягоды можжевельника. Также кориандр, корень дягиля, кардамон, корица, ирисовый корень, цитрусовая цедра. Набор зависит от рецептуры."], ["Извлечение аромата", "Ботаникалы настаивают в спирте, перегоняют вместе с ним или кладут в корзину, через которую проходят спиртовые пары, — так аромат извлекается без погружения в жидкость."], ["Дистилляция", "Смесь нагревают, летучие ароматические соединения уходят в пар вместе со спиртом, затем конденсируются. Мастер-дистиллер контролирует профиль."], ["Крепость и розлив", "Продукт разбавляют водой до нужной крепости, иногда дают отдохнуть, фильтруют и разливают."]]}, {"type": "note", "text": "Простой способ — ароматизировать нейтральный спирт готовыми препаратами. В ЕС это может быть категория Gin, но не Distilled Gin."}, {"type": "h", "text": "Что дают ботаникалы"}, {"type": "table", "head": ["Компонент", "Вклад в аромат"], "rows": [["Можжевельник", "Хвоя, смола, сухие древесные ноты"], ["Кориандр", "Цитрусовые, пряные, слегка перечные ноты"], ["Цедра лимона", "Свежесть, яркий цитрус"], ["Цедра апельсина", "Более округлый, сладковатый цитрус"], ["Корень дягиля", "Землистые, сухие, корневые оттенки"], ["Кардамон", "Тёплые пряные, иногда эвкалиптовые оттенки"], ["Ирисовый корень", "Фиксация и поддержка аромата"]]}, {"type": "p", "text": "Это ориентиры, а не формула: вкус зависит от количества сырья, экстракции, дистилляции и сочетания компонентов. Выраженно можжевеловый джин держит структуру сухого Martini, а цитрусовый и мягкий хорошо раскрывается в Gin & Tonic."}]}, {"id": "types", "title": "Виды", "blocks": [{"type": "h", "text": "Юридические категории ЕС"}, {"type": "cards", "items": [["Gin", "Категория 1", "Ароматизация сельскохозяйственного спирта можжевельником. Допускаются ароматические вещества, но вкус должен определяться преимущественно можжевельником. Мин. 37,5%."], ["Distilled Gin", "Категория 2", "Дистилляция спирта крепостью не менее 96% в присутствии можжевельника и натуральных растительных компонентов. Добавление эссенции не делает джин дистиллированным."], ["London Gin / London Dry", "Категория 3", "Строгая категория: аромат только от дистилляции ботаникалов, без окрашивания, подслащивание не более 0,1 г/л. После перегонки можно добавить спирт и воду."]]}, {"type": "note", "text": "London — это технология и требования, а не место. London Dry не обязательно сделан в Лондоне."}, {"type": "h", "text": "Барные стили"}, {"type": "cards", "items": [["London Dry Gin", "Стиль", "Сухой, с отчётливым можжевельником, цитрусом и специями. Martini, Gin & Tonic, Negroni."], ["Plymouth Gin", "Стиль", "Традиционный стиль города Плимут. Современный Plymouth производят на одной исторической дистиллерии с 1793 года."], ["Old Tom Gin", "Стиль", "Исторический, часто мягче и слаще London Dry. Хорош для Tom Collins и Martinez. Сладость зависит от продукта."], ["Navy Strength", "Стиль", "Повышенная крепость, часто около 57%. Морская традиция, а не юридическая категория."], ["Contemporary / New Western", "Стиль", "Барное обозначение джинов, где цитрус, цветы, травы или фрукты заметно конкурируют с можжевельником."], ["Sloe Gin", "Ликёр", "Сладкий напиток на основе джина с тёрном. В ЕС — отдельная категория ликёров, не разновидность сухого джина."]]}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "Сначала попробуйте небольшую порцию без льда при умеренной температуре. Затем добавьте немного воды и сравните."}, {"type": "h", "text": "На что обращать внимание"}, {"type": "list", "items": ["Начальный вкус", "Баланс можжевельника, цитрусов и специй", "Ощущение спирта", "Текстура", "Послевкусие"]}, {"type": "note", "text": "Единой температуры подачи нет. Сильное охлаждение уменьшает ощущение спирта, но приглушает ароматику. Лёд и разбавление меняют и концентрацию вкуса."}]}, {"id": "cocktails", "title": "Коктейли", "blocks": [{"type": "cocktails", "items": [["Gin & Tonic", "Джин, тоник, лёд и гарнир. Цитрусовые, огурец или травы подбирают под конкретный джин."], ["Martini", "Джин и сухой вермут. Важны баланс, разбавление и температура."], ["Negroni", "Джин, красный вермут и красный горький аперитив. Можжевельник должен выдерживать сладость и горечь остальных компонентов."]]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "olist", "items": ["Исторический предшественник джина — женевер из Нидерландов и соседних регионов.", "Можжевельник — ключевой ароматический компонент.", "Gin, Distilled Gin и London Gin — разные юридические категории, а не уровни качества.", "Old Tom, Plymouth и Navy Strength описывают стили, но не все они — категории законодательства ЕС.", "Выбор джина для коктейля начинается с понимания его ароматического профиля."]}, {"type": "quiz", "q": "Почему два джина одинаковой крепости могут совершенно по-разному работать в одном Gin & Tonic?", "a": "Крепость не определяет вкус. На него влияют ботаникалы, способы экстракции, дистилляция и баланс ароматических компонентов."}]}], "cover": "img/mvxucmqx.jpg"}, {"id": "tequila", "num": "02", "name": "Текила", "en": "Tequila", "tagline": "Вкус голубой агавы и характер Мексики", "facts": [["Крепость", "≈35–40%"], ["Родина", "Халиско, Мексика"], ["Сырьё", "Голубая агава"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Текила — мексиканский крепкий напиток из голубой агавы вида Agave tequilana Weber, разновидность Azul."}, {"type": "p", "text": "В отличие от джина, аромат формируется не добавленными ботаникалами, а самой агавой и процессами её приготовления, ферментации, дистилляции и выдержки."}, {"type": "p", "text": "Возможные ароматы: свежая трава, цитрус, зелёный перец, варёная агава, карамель, ваниль, дуб, специи."}, {"type": "note", "text": "Текила — защищённое наименование происхождения. Производство регулирует стандарт NOM-006-SCFI-2012, контролирует Consejo Regulador del Tequila (CRT)."}, {"type": "p", "text": "Чаще всего встречаются бутылки крепостью около 35–40%; допустимые пределы определяются правилами и маркировкой."}, {"type": "h", "text": "Родина и зона происхождения"}, {"type": "p", "text": "Исторический центр — штат Халиско, особенно окрестности города Текила, давшего напитку имя."}, {"type": "p", "text": "Защищённая зона: весь Халиско и определённые территории штатов Гуанахуато, Мичоакан, Наярит и Тамаулипас. Недостаточно просто вырастить агаву в Мексике — нужны соблюдение требований и сертификация."}]}, {"id": "history", "title": "История", "blocks": [{"type": "timeline", "items": [["До колонизации", "Коренные народы используют агаву для волокон, пищи и сладкого сока. Известен ферментированный напиток пульке."], ["Колониальный период", "Европейцы привозят дистилляцию. Местное сырьё и новые технологии постепенно дают дистилляты из агавы."], ["Позже", "Производство развивается вокруг поселений и хозяйств. Город Текила становится главным центром, а его имя — названием продукта."], ["XX век", "Защита происхождения и стандартизация: что можно называть текилой, какое сырьё допустимо, как обозначать категории."], ["Сегодня", "Один из символов мексиканской гастрономии и важный ингредиент мировой миксологии."]]}, {"type": "note", "text": "Пульке — ферментированный напиток, текила — дистиллированный. Точную дату изобретения назвать нельзя: истории об одном изобретателе стоит воспринимать осторожно."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "p", "text": "Используют сердцевину агавы — piña (похожа на ананас). Углеводы агавы в основном в форме инулина и фруктанов: их нельзя сразу сбродить, сначала их превращают в сахара."}, {"type": "p", "text": "Агаву выращивают несколько лет. Работники-jimadores срезают листья и извлекают сердцевину."}, {"type": "steps", "items": [["Сбор агавы", "Срезают листья, оставляют сердцевину. Качество зависит от зрелости, места и агротехники."], ["Приготовление", "Сердцевины нагревают в печах или автоклавах, превращая углеводы в сахара. Медленное приготовление даёт карамельные и варёно-агавовые оттенки."], ["Извлечение сока", "Агаву измельчают механически, прессуют или давят каменным жерновом tahona."], ["Ферментация", "Дрожжи превращают сахар в спирт и формируют фруктовые, цветочные, травяные ноты."], ["Дистилляция", "Перегонка концентрирует спирт и аромат. Оборудование влияет на характер."], ["Выдержка и розлив", "Без выдержки, в деревянных ёмкостях или купаж разрешённых компонентов; затем крепость, фильтрация, розлив."]]}, {"type": "note", "text": "Не вся текила выдерживается в дубе. Blanco может поступать в продажу практически сразу."}]}, {"id": "types", "title": "Виды", "blocks": [{"type": "h", "text": "Категории по сахарам"}, {"type": "cards", "items": [["Tequila 100% Agave", "Категория", "Сахара только из голубой агавы. Розлив в пределах зоны происхождения."], ["Tequila", "Категория", "Не менее 51% сахаров голубой агавы, до 49% других разрешённых сахаров."]]}, {"type": "note", "text": "Текила без надписи 100% Agave не автоматически плохая, но бармену важно понимать сырьевую категорию и уметь объяснить её гостю."}, {"type": "h", "text": "Классы по выдержке"}, {"type": "cards", "items": [["Blanco / Silver / Plata", "Без выдержки", "Свежая агава, травы, цитрус, перец. Margarita, Paloma и освежающие коктейли."], ["Joven / Oro", "Молодая / купаж", "Золотистый цвет не обязательно означает выдержку — может быть разрешённая обработка."], ["Reposado", "от 2 месяцев", "Мягкие древесные, ванильные, пряные оттенки при узнаваемом характере агавы."], ["Añejo", "от 1 года", "Ёмкости не более 600 л. Округлый вкус: ваниль, специи, дерево, карамель."], ["Extra Añejo", "от 3 лет", "Глубокие древесные, пряные, карамельные и шоколадные оттенки."]]}, {"type": "note", "text": "Выдержка не гарантирует, что напиток лучше. Чрезмерный дуб может маскировать характер агавы."}, {"type": "h", "text": "Текила и мескаль"}, {"type": "list", "items": ["Текила — только голубая агава Azul в установленной зоне.", "Мескаль — свои нормы, разные разрешённые виды агавы в своих зонах.", "Дымность часто у мескаля (агаву готовят в ямах с камнями), но она не обязательна.", "Текила тоже бывает дымной, травяной, фруктовой и землистой."]}, {"type": "note", "text": "Не объясняйте гостю разницу фразой «текила не дымная, мескаль дымный» — это слишком сильное упрощение."}, {"type": "h", "text": "Известные производители"}, {"type": "list", "items": ["José Cuervo — один из самых известных, долгая история", "Patrón — премиальный сегмент, разные классы", "Don Julio — линейки от Blanco до выдержанных", "Olmeca — широко представлен на международном рынке", "Herradura — Халиско, традиционное производство"]}, {"type": "p", "text": "Это не рейтинг. Изучайте конкретную бутылку: категорию, крепость, маркировку 100% Agave, профиль и поведение в коктейле."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "Берите небольшой бокал, чтобы чувствовать аромат, а не только крепость. Начинайте с Blanco, затем выдержанные."}, {"type": "olist", "items": ["Аромат: свежая или приготовленная агава, цитрус, травы, перец, фрукты, дерево.", "Вкус: интенсивность агавы, кислотно-фруктовые ассоциации, пряность, текстура.", "Послевкусие: длина, сухость, сладковатость, специи, дерево."]}, {"type": "h", "text": "Подача"}, {"type": "list", "items": ["Чистая — для качественной Blanco, Reposado, Añejo.", "Соль и лайм — популярный ритуал, но не обязательный; меняет восприятие вкуса.", "В коктейлях — стиль текилы подбирается под желаемый профиль."]}]}, {"id": "cocktails", "title": "Коктейли", "blocks": [{"type": "cocktails", "items": [["Margarita", "Текила, апельсиновый ликёр и сок лайма. Важно сбалансировать крепость, кислотность и сладость."], ["Paloma", "Текила и грейпфрутовая составляющая, часто с содовой и лаймом."], ["Tequila Sunrise", "Текила, апельсиновый сок и гренадин. Градиент цвета, сладкий фруктовый профиль."], ["Tommy’s Margarita", "Вместо апельсинового ликёра — сироп агавы. Подчёркивает связь с сырьём."]]}, {"type": "note", "text": "Для свежих цитрусовых коктейлей — Blanco. Reposado добавляет округлость, Añejo чаще интереснее соло."}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "olist", "items": ["Текилу делают из голубой агавы Agave tequilana Weber, разновидность Azul.", "Название защищено географическими и производственными требованиями.", "100% Agave и Tequila различаются происхождением сахаров.", "Blanco, Joven, Reposado, Añejo, Extra Añejo — классы по обработке и выдержке.", "Мескаль — не «дымная текила», а отдельная категория.", "Важно, как характер агавы сочетается с другими ингредиентами."]}, {"type": "quiz", "q": "Почему две Blanco могут отличаться сильнее, чем Blanco и Reposado одного производителя?", "a": "Даже без дуба аромат зависит от зрелости агавы, приготовления, ферментации, дрожжей, дистилляции и решений производителя."}]}], "cover": "img/mvxuhre8.jpg"}, {"id": "rum", "num": "03", "name": "Ром", "en": "Rum", "tagline": "Сахарный тростник, Карибы и морские пути", "facts": [["Мин. крепость", "37,5%"], ["Родина", "Карибы, XVII в."], ["Сырьё", "Тростник"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Ром — дистиллят продуктов ферментации сахарного тростника: мелассы, тростникового сиропа или свежего сока."}, {"type": "p", "text": "Характер рома зависит от сырья, ферментации, перегонки и выдержки. Ароматы: банан, ананас, тропические фрукты, патока, карамель, ваниль, дерево, специи, орехи."}, {"type": "p", "text": "Не каждый ром сладкий: сухой ром бывает интенсивным, травянистым, фруктовым или даже «минеральным»."}, {"type": "p", "text": "По регламенту ЕС 2019/787: крепость от 37,5%, характерные свойства рома должны сохраняться, посторонний алкоголь добавлять нельзя, подслащивание — до 20 г/л."}, {"type": "note", "text": "Цвет, сладость и крепость сами по себе не говорят, каким ром будет в коктейле."}, {"type": "h", "text": "Сырьё"}, {"type": "cards", "items": [["Меласса", "Основное сырьё", "Густой побочный продукт сахарного производства. Насыщенная основа, разнообразный профиль."], ["Сок тростника", "Свежий", "Ромы из свежего сока, часто с особой региональной идентичностью."], ["Тростниковый сироп", "Концентрат", "Концентрированный продукт переработки тростника."]]}, {"type": "note", "text": "Rhum agricole традиционно — ром из сока тростника. В ЕС слово agricultural применяется только для отдельных географических указаний (французские заморские территории, Мадейра)."}]}, {"id": "history", "title": "История", "blocks": [{"type": "timeline", "items": [["Начало XVII века", "На Карибах остатки сахарного производства начинают перегонять в ром. Он быстро становится товаром для торговли и экспорта."], ["XVII век", "Сахарная промышленность растёт. Ром удобно перевозить в бочках и продавать на дальних рынках."], ["XVIII век", "Ром связан с британским флотом и традицией алкогольного пайка морякам."], ["Далее", "Регионы формируют свои традиции: от лёгкого нейтрального профиля до насыщенного фруктового."]]}, {"type": "note", "text": "Обратная сторона истории: производство сахара и рома зависело от эксплуатации и принудительного труда порабощённых людей. История рома — это и колониальная экономика, и человеческая трагедия."}, {"type": "p", "text": "Ром не был изобретён одним человеком или в один год — его история складывалась постепенно в разных колониях."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "steps", "items": [["Подготовка сырья", "Мелассу, сироп или сок разбавляют водой и готовят условия для дрожжей."], ["Ферментация", "Быстрая — для лёгких профилей, длительная или контролируемая — для сложного фруктового аромата."], ["Дистилляция", "Медь, форма аппарата, число перегонок и отбор фракций влияют на ароматические вещества."], ["Формирование стиля", "Одни делают лёгкий дистиллят, другие сохраняют больше ароматических соединений."], ["Выдержка, купаж, розлив", "Без выдержки или в бочках; купажирование, доведение крепости, розлив."]]}, {"type": "h", "text": "Почему ферментация так важна"}, {"type": "p", "text": "Дрожжи производят не только спирт, но и эфиры, высшие спирты, кислоты. Длительные ферментации дают интенсивные фруктовые ароматы — поэтому ямайский ром так отличается от лёгкого рома других регионов."}]}, {"id": "types", "title": "Виды", "blocks": [{"type": "p", "text": "Единой международной классификации по цвету или выдержке у рома нет. На этикетке — стиль, регион, технология, маркетинг."}, {"type": "cards", "items": [["White / Blanco / Silver", "Лёгкий", "Прозрачный, относительно лёгкий. Может быть выдержан и отфильтрован. Daiquiri, Mojito."], ["Gold / Golden", "Золотой", "Цвет — выдержка, купаж или разрешённая корректировка цвета. Возраст не гарантирует."], ["Dark Rum", "Тёмный", "Насыщенный, но оттенок не доказывает долгую выдержку. Читайте маркировку."], ["Jamaican Rum", "Ямайка", "Интенсивный фруктовый и ферментативный профиль."], ["Rhum Agricole", "Из сока", "Травянистые, растительные, свежие и землистые ноты."], ["Overproof / Navy Style", "Крепкий", "Повышенная крепость или традиция. Не единая юридическая категория."]]}, {"type": "h", "text": "Ром и география"}, {"type": "table", "head": ["Страна", "Чем известна"], "rows": [["Ямайка", "Насыщенные ромы с ярким фруктовым ароматом"], ["Барбадос", "Давняя история, стили от лёгких до насыщенных"], ["Куба", "Лёгкие ромы для коктейльной культуры"], ["Мартиника", "Rhum agricole, наименование Rhum Agricole Martinique AOC"], ["Гайана", "Насыщенные ромы, разные типы перегонных аппаратов"]]}, {"type": "note", "text": "Это обобщения, а не правила: в каждой стране есть разные производители."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "Небольшой бокал, сравнение по нарастающей — не начинайте с самого тёмного или крепкого образца."}, {"type": "olist", "items": ["Аромат: тростник, патока, фрукты, специи, дерево.", "Сладость и текстура: сухой, округлый, маслянистый, лёгкий.", "Интенсивность ферментативных, фруктовых и древесных нот.", "Послевкусие: пряности, тропические фрукты, ваниль, сухое дерево."]}, {"type": "note", "text": "Не переохлаждайте насыщенный ром при дегустации. В коктейлях лёд и разбавление — часть рецепта."}]}, {"id": "cocktails", "title": "Коктейли", "blocks": [{"type": "cocktails", "items": [["Daiquiri", "Ром, сок лайма, сахар. Ром должен быть заметен, но не подавлять кислотность и сладость."], ["Mojito", "Ром, лайм, сахар, мята, содовая. Важны свежесть и аккуратность с мятой."], ["Mai Tai", "Классика тики: ром, лайм, апельсиновый ликёр, орже. Выбор рома сильно меняет аромат."], ["Cuba Libre", "Ром, кола, лайм. Ром либо поддерживает вкус, либо теряется в сладости."]]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "olist", "items": ["Ром делают из продуктов ферментации сахарного тростника.", "Меласса — основное, но не единственное сырьё.", "Ферментация и дистилляция сильно влияют на аромат.", "Цвет — ненадёжный показатель возраста.", "Ромы разных регионов сильно различаются.", "Для коктейля выбирайте по интенсивности, аромату и текстуре, а не по цене и цвету."]}]}], "cover": "img/mvxujx25.jpg"}, {"id": "vodka", "num": "04", "name": "Водка", "en": "Vodka", "tagline": "От зернового сырья до нейтрального спирта", "facts": [["Мин. крепость", "37,5%"], ["Корни", "Россия, Польша"], ["Профиль", "Нейтральный"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Водка — крепкий напиток на основе этилового спирта сельскохозяйственного происхождения: из зерновых, картофеля и другого разрешённого сырья."}, {"type": "p", "text": "Главная особенность — относительно нейтральный профиль. Задача — чистый спирт с контролируемыми свойствами, доведённый водой до нужной крепости."}, {"type": "p", "text": "Но вся водка не одинакова: различаются текстура, ощущение спирта, мягкость, лёгкие зерновые оттенки, послевкусие."}, {"type": "p", "text": "Регламент ЕС 2019/787: минимум 37,5%; спирт дистиллируют для избирательного уменьшения свойств сырья и побочных продуктов ферментации."}, {"type": "note", "text": "Для бармена ценна нейтральность: коктейль строится вокруг других ингредиентов."}, {"type": "h", "text": "Сырьё"}, {"type": "table", "head": ["Сырьё", "Ориентир"], "rows": [["Пшеница", "Относительно мягкий, нейтральный профиль"], ["Рожь", "Более выраженные зерновые и пряные оттенки"], ["Картофель", "Влияет на текстуру и ощущение во рту"], ["Кукуруза", "Может давать очень нейтральный спирт"], ["Другие культуры", "По законодательству и категории"]]}, {"type": "p", "text": "Это ориентиры: итог зависит от сорта, ферментации, ректификации, обработки и воды. В ЕС, если водка не только из зерна или картофеля, сырьё указывают на этикетке рядом с названием."}]}, {"id": "history", "title": "История", "blocks": [{"type": "p", "text": "Водка связана с Восточной и Северной Европой, особенно с Россией и Польшей. Кто был первым — вопрос сложный: названия, методы и определения менялись веками."}, {"type": "timeline", "items": [["Ранний период", "Перегонка распространяется по Европе; дистилляты используют в медицине, для настоек и как крепкие напитки."], ["Россия", "Производство тесно связано с государственным регулированием торговли и налогами; растёт роль зерна и перегонки."], ["Польша", "Своя традиция, в том числе на основе ржи и других культур."], ["XIX–XX века", "Ректификация позволяет получать более нейтральный спирт — ключевой шаг к современной водке."], ["Сегодня", "Водка — один из базовых спиртов барной индустрии, её производят во многих странах."]]}, {"type": "note", "text": "Ранние крепкие напитки региона нельзя автоматически считать современной водкой."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "steps", "items": [["Подготовка сырья", "Зерно измельчают, картофель готовят. Крахмал ферментами превращают в сахара."], ["Ферментация", "Дрожжи дают спирт и соединения, влияющие на аромат и чистоту."], ["Дистилляция и ректификация", "Спирт отделяют и очищают; ректификация даёт высокую крепость с низким содержанием примесей."], ["Дополнительная обработка", "Фильтрация, в том числе активированным углём — ради профиля, а не только прозрачности."], ["Разбавление водой", "Вода нужной крепости; её состав влияет на восприятие."], ["Финальная обработка и розлив", "Проверка соответствия, при необходимости фильтрация, контроль стабильности."]]}, {"type": "h", "text": "Почему водка разная, если спирт очищают"}, {"type": "list", "items": ["Состав и качество спирта", "Степень удаления примесей", "Методы фильтрации", "Вода", "Крепость", "Решения производителя"]}, {"type": "note", "text": "В ЕС водка не обязана быть совсем безвкусной: допускаются особенности от сырья, но не доминирующий посторонний вкус."}]}, {"id": "types", "title": "Виды", "blocks": [{"type": "p", "text": "Единой классификации по выдержке нет. В баре удобно делить по сырью, профилю и назначению."}, {"type": "cards", "items": [["Классическая", "Тип 1", "Прозрачная, без доминирующего аромата. Даёт крепость и структуру, не перебивая компоненты."], ["С сырьевым характером", "Тип 2", "Заметные зерновые и хлебные оттенки. Для чистой подачи и коктейлей с малым числом ингредиентов."], ["Премиальная", "Позиционирование", "Не юридическая категория. Цена и дизайн бутылки не доказывают превосходство вкуса."], ["Ароматизированная", "Тип 4", "Цитрус, перец, ягоды. В ЕС — отдельная категория со своими требованиями."]]}, {"type": "h", "text": "Миф о «самой чистой водке»"}, {"type": "p", "text": "Количество фильтраций — не показатель качества. Фильтрация не заменяет контроль сырья, ферментации, дистилляции и безопасности."}, {"type": "list", "items": ["Насколько выражен спирт", "Есть ли посторонние запахи", "Текстура", "Послевкусие", "Поведение в коктейле"]}, {"type": "note", "text": "Не путайте химическую чистоту и вкусовое качество. Безопасность подтверждает производственный контроль, а не реклама."}]}, {"id": "tasting", "title": "Дегустация", "blocks": [{"type": "p", "text": "Традиционно подают охлаждённой, но для профессиональной дегустации сравнивайте при умеренной температуре."}, {"type": "olist", "items": ["Аромат: нейтральность, зерновые и тонкие оттенки.", "Атака: насколько резко ощущается спирт.", "Текстура: лёгкая, сухая, маслянистая, округлая.", "Послевкусие: короткое, нейтральное, зерновое."]}, {"type": "note", "text": "Сильный холод не превращает плохую водку в хорошую — он лишь приглушает аромат и спирт."}]}, {"id": "cocktails", "title": "Коктейли", "blocks": [{"type": "cocktails", "items": [["Moscow Mule", "Водка, имбирное пиво, лайм. Характер дают имбирь, цитрус и газ."], ["Cosmopolitan", "Водка, апельсиновый ликёр, клюква, лайм. Баланс сладости и кислотности."], ["Espresso Martini", "Водка, кофейный ликёр, эспрессо. Кофе остаётся главным."], ["Bloody Mary", "Водка, томатный сок, приправы. Нейтральная основа для солёного и пряного."]]}]}, {"id": "summary", "title": "Запомнить", "blocks": [{"type": "olist", "items": ["Водку делают из спирта сельскохозяйственного происхождения.", "Сырьё — зерно, картофель и другие разрешённые продукты.", "Ректификация и фильтрация не гарантируют вкусового качества.", "Минимальная крепость по регламенту ЕС — 37,5%.", "Тонкие различия в аромате и текстуре существуют.", "В коктейлях водка — универсальная основа."]}]}], "cover": "img/mvxum3vx.jpg"}, {"id": "whisky", "num": "05", "name": "Виски", "en": "Whisky", "tagline": "История, производство и классификации", "facts": [["Сырьё", "Зерно"], ["Родина", "Ирландия, Шотландия"], ["Выдержка", "Бочки"]], "sections": [{"id": "basics", "title": "Основы", "blocks": [{"type": "lead", "text": "Виски — это не один вкус и не только Шотландия: от лёгких зерновых и фруктовых до сладких бурбонов, пряных ржаных и дымных торфяных."}, {"type": "p", "text": "Виски получают сбраживанием зерна, дистилляцией и — для большинства категорий — выдержкой в деревянных бочках."}, {"type": "table", "head": ["Зерно", "Роль"], "rows": [["Ячмень", "Главный для шотландского односолодового"], ["Кукуруза", "Основа многих бурбонов"], ["Рожь", "Перечная, пряная сухость"], ["Пшеница", "Мягкий, хлебный, округлый профиль"], ["Другие злаки", "По стране и категории"]]}, {"type": "p", "text": "Ароматы: яблоко, груша, ваниль, карамель, орехи, специи, сухофрукты, кожа, табак, дым."}, {"type": "note", "text": "Цвет не говорит о возрасте и качестве: тёмный виски не обязательно старше светлого."}, {"type": "h", "text": "Где появился виски"}, {"type": "p", "text": "Ирландия и Шотландия — обе с давней традицией зерновой дистилляции; первенство одной датой не определить. Слово whisky связывают с гэльским «вода жизни»."}, {"type": "p", "text": "Whiskey — чаще в Ирландии и США, whisky — в Шотландии. Позже сложились бурбон и рай в США, купажная и ржаная традиция в Канаде, японская школа под влиянием Шотландии."}]}, {"id": "production", "title": "Производство", "blocks": [{"type": "steps", "items": [["Подготовка зерна", "Зерно измельчают и смешивают с горячей водой. Для солодового ячмень проращивают и сушат; торфяной дым даёт дымные фенолы."], ["Брожение", "Дрожжи дают спирт и ароматы. Получается слабоалкогольная жидкость — wash."], ["Дистилляция", "Медные pot stills — выразительный дистиллят; колонны — непрерывное эффективное производство."], ["Выдержка в бочках", "Ваниль, специи, карамель, сухофрукты. Важны история бочки, обжиг, климат, время."], ["Купаж и розлив", "Мастер соединяет бочки, возрасты, винокурни; разбавление и фильтрация."]]}, {"type": "note", "text": "Бурбон выдерживают в новых обожжённых бочках, шотландский — часто в бочках из-под других напитков."}, {"type": "h", "text": "Возраст на бутылке"}, {"type": "p", "text": "Возраст — время в бочке, а не с момента розлива. 12 Years Old — самому молодому спирту в купаже не меньше 12 лет."}, {"type": "list", "items": ["NAS (No Age Statement) — возраст не указан, это не значит «плохой».", "Возраст не равен качеству.", "Больше лет — не всегда лучше: дерево может перекрыть аромат.", "Год на этикетке и возраст — не одно и то же."]}]}, {"id": "types", "title": "Виды", "blocks": [{"type": "p", "text": "Разделяйте: категория производства (Single Malt, Blended), происхождение (Scotch, Irish, Bourbon) и характер вкуса (торфяной, фруктовый)."}, {"type": "h", "text": "Scotch Whisky"}, {"type": "p", "text": "Произведён и выдержан в Шотландии, от 3 лет в дубе до 700 л, от 40% при розливе. Добавки — только вода и карамельный краситель."}, {"type": "cards", "items": [["Single Malt", "Одна винокурня", "Вода и соложёный ячмень, pot stills. Солод, фрукты, мёд, орехи, иногда дым. Single — одна винокурня, а не одна бочка."], ["Single Grain", "Одна винокурня", "Не Single Malt, могут быть другие злаки, часто колонны. Мягкий, зерновой, ванильный."], ["Blended Malt", "Купаж", "Два и более Single Malt с разных винокурен."], ["Blended Grain", "Купаж", "Два и более Single Grain с разных винокурен."], ["Blended Scotch", "Купаж", "Single Malt + Single Grain. От лёгкого до сложного и дымного."]]}, {"type": "note", "text": "Single Malt не обязательно лучше Blended — это разные категории производства."}, {"type": "h", "text": "Irish Whiskey"}, {"type": "list", "items": ["Single Malt — соложёный ячмень, одна винокурня", "Single Pot Still — соложёный и несоложёный ячмень, традиционные кубы", "Single Grain — зерновой, не Malt и не Pot Still", "Blended — смесь двух и более типов"]}, {"type": "p", "text": "Выдержка от 3 лет, крепость от 40%. Часто мягкий и фруктовый, но бывает насыщенный, пряный, дымный."}, {"type": "h", "text": "Американский виски"}, {"type": "cards", "items": [["Bourbon", "США, ≥51% кукурузы", "Новые обожжённые дубовые ёмкости. Ваниль, карамель, ириска, специи. Не обязательно Кентукки."], ["Straight Bourbon", "от 2 лет", "При выдержке меньше 4 лет — доп. требования к указанию возраста."], ["Rye Whiskey", "≥51% ржи", "Сухой, пряный, перечный: корица, травы, цедра, дерево."], ["Tennessee Whiskey", "Стиль", "Обычно с фильтрацией через древесный уголь. Не просто другое имя бурбона."]]}, {"type": "h", "text": "Канада и Япония"}, {"type": "p", "text": "Canadian — разнообразие зерновых рецептур и купажей, важна рожь; выдержка обычно от 3 лет. Japanese — шотландские корни и собственный подход: от лёгких фруктовых до дымных и сложных купажей. Проверяйте спецификацию — слово Japanese на этикетке само по себе ничего не гарантирует."}, {"type": "h", "text": "Стили по вкусу"}, {"type": "cards", "items": [["Peated / Торфяной", "Стиль", "Костёр, дым, йод, море, лекарственные ноты. Не юридическая категория."], ["Sherry Cask", "Стиль", "Сухофрукты, орехи, специи, шоколад."], ["Бурбонный", "Стиль", "Карамель, ваниль, сладкие специи, кокос, дуб."], ["Лёгкий фруктовый", "Стиль", "Яблоко,
