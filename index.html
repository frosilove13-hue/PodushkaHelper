 {t:"k",m:/драник/i,q:"Драники — национальное блюдо какой страны?",a:"Беларуси",o:["Польши","Германии","Литвы"],why:"Драники из тёртого картофеля — символ белорусской кухни. Название от слова «драть» — тереть на тёрке."},
 {t:"k",m:/сырник/i,q:"Почему сырники называются «сырниками», если их делают из творога?",a:"Раньше в России творог тоже называли «сыром»",o:["Раньше в тесто добавляли твёрдый сыр","Их придумали сыровары","Это слово пришло из польского"],why:"Слово «сыр» долго означало и творог — отсюда сырники, сырная неделя на Масленицу и творожные «сырки»."},
 {t:"k",m:/бер блан/i,q:"Что означает «бёр блан» (beurre blanc)?",a:"«Белое масло» — французский соус из масла, вина и шалота",o:["«Белый хлеб»","«Сливочный сыр»","«Белый бульон»"],why:"Beurre blanc — эмульсия холодного сливочного масла с уваренным вином (или уксусом) и шалотом. Классика к рыбе — у нас к треске."},
 {t:"k",m:/велюте/i,q:"Велюте — это...",a:"Один из «материнских» соусов французской кухни",o:["Итальянский сыр","Японский бульон","Испанская колбаса"],why:"Velouté — «бархатистый»: светлый бульон, загущённый мучной заправкой. На его основе делают множество других соусов."},
 {t:"k",m:/понзу/i,q:"Понзу — это соус...",a:"Японский: цитрусовый сок и соевый соус",o:["Корейский: острый перец и мёд","Тайский: рыбный соус и сахар","Китайский: чёрные бобы"],why:"Понзу — японский соус на основе цитрусов (юдзу, лимон) с соевым соусом, мирином и даси. Свежий, кисловатый — отлично к рыбе."},
 {t:"k",m:/коулслоу/i,q:"Что означает «коулслоу»?",a:"«Капустный салат» — от нидерландского koolsla",o:["«Медленный уголь»","«Холодная закуска»","«Деревенский соус»"],why:"Голландские поселенцы привезли в Америку koolsla — салат из капусты. Сейчас это классический гарнир к мясу."},
 {t:"k",m:/гриссини/i,q:"Где родина гриссини?",a:"Турин, Италия",o:["Неаполь","Барселона","Марсель"],why:"Хрустящие хлебные палочки придумали в Турине в XVII веке — по легенде, для маленького герцога, которому был тяжёл обычный хлеб."},
 {t:"k",m:/фуэт/i,q:"Фуэт — сыровяленая колбаса родом из...",a:"Каталонии, Испания",o:["Тосканы, Италия","Баварии, Германия","Прованса, Франция"],why:"Fuet — тонкая каталонская колбаса из свинины. Название значит «хлыстик» — из-за формы."},
 {t:"k",m:/чебурек/i,q:"Чебуреки — блюдо какой кухни?",a:"Крымскотатарской",o:["Грузинской","Узбекской","Армянской"],why:"Чебуреки пришли из кухни крымских татар и тюркских народов, а в СССР стали фастфудом номер один."},
 {t:"b",m:/негрони/i,q:"Как появился коктейль «Негрони»?",a:"Граф Камилло Негрони во Флоренции попросил заменить содовую в «Американо» джином",o:["Его придумали в Нью-Йорке во время сухого закона","Его придумала компания Campari для рекламы","Его привезли из Аргентины"],why:"Около 1919 года, кафе «Касони» во Флоренции. С тех пор рецепт — джин, кампари и красный вермут в равных частях."},
 {t:"b",m:/спритц/i,q:"Откуда пошло слово «спритц»?",a:"Австрийские солдаты в Венето разбавляли вино водой — spritzen по-немецки «брызгать»",o:["От названия венецианского моста","От фамилии бармена","От итальянского «искра»"],why:"В XIX веке северо-восток Италии был под властью Австрии. Позже в вино с водой стали добавлять горькие ликёры — так появились Aperol и Campari спритц."},
 {t:"b",m:/маргарита/i,q:"Где появилась «Маргарита»?",a:"В Мексике, в 1930–40-е годы",o:["На Кубе","В Испании","В Майами"],why:"Точный автор спорен — версий десяток, но все про Мексику и середину XX века. Классика: текила, апельсиновый ликёр и лайм."},
 {t:"b",m:/дайкири/i,q:"В честь чего назван «Дайкири»?",a:"Посёлка Дайкири на Кубе, где работали американские горные инженеры",o:["Японского слова «большой лёд»","Имени жены Хемингуэя","Сорта кубинского сахара"],why:"Начало XX века: инженеры на железных рудниках у Дайкири смешивали ром, лайм и сахар. Позже коктейль обожал Хемингуэй."},
 {t:"b",m:/мул/i,q:"Зачем придумали «Московский мул»?",a:"Чтобы продать американцам водку Smirnoff и имбирное пиво",o:["В честь визита советской делегации","Как лекарство от простуды","Для московского Олимпийского бара"],why:"Лос-Анджелес, 1940-е: водка в США плохо продавалась, а у бара залежалось имбирное пиво. Фирменная медная кружка — тоже часть маркетинга."},
 {t:"b",m:/белый русский/i,q:"Какой фильм сделал «Белый русский» культовым?",a:"«Большой Лебовски»",o:["«Касабланка»","«Криминальное чтиво»","«Брат»"],why:"Чувак из фильма братьев Коэн пьёт «Белого русского» почти в каждой сцене. Сам коктейль — «Чёрный русский» (водка + кофейный ликёр) со сливками."},
 {t:"b",m:/виски сауэр/i,q:"Что в классическом «Виски сауэр» даёт бархатную пенку?",a:"Яичный белок",o:["Сливки","Тоник","Мёд"],why:"Сауэр — «кислый»: виски, лимон, сахар. Белок по желанию — с ним текстура мягче и появляется пенка."},
 {t:"b",m:/кловер клаб/i,q:"Откуда название «Кловер клаб»?",a:"Так назывался мужской клуб в Филадельфии",o:["Это сорт клевера в составе","Так звали лошадь-победителя скачек","Так назывался бар в Лондоне"],why:"Clover Club — клуб журналистов и юристов Филадельфии до сухого закона. Состав: джин, малина, лимон и белок."},
 {t:"b",m:/порн стар/i,q:"Кто и когда придумал «Порн стар»?",a:"Лондонский бармен Дуглас Анкра в начале 2000-х",o:["Голливудские продюсеры в 1970-е","Бармены Лас-Вегаса в 1990-е","Его придумали в Париже в 1920-е"],why:"Маракуйя, ванильная водка и шот игристого рядом. Сам автор называл его Maverick Martini."},
 {t:"b",m:/сайдкар/i,q:"В честь чего назван «Сайдкар»?",a:"Мотоцикла с коляской",o:["Железнодорожного вагона","Фамилии бармена","Гоночной машины"],why:"Sidecar — «коляска мотоцикла». Коктейль появился в Париже или Лондоне после Первой мировой: коньяк, апельсиновый ликёр и лимон."},
 {t:"b",m:/эспрессо мартини/i,q:"Кто придумал «Эспрессо мартини»?",a:"Лондонский бармен Дик Брэдселл в 1980-е",o:["Итальянские баристы в 1950-е","Бармены Нью-Йорка в 2010-е","Компания Martini для рекламы"],why:"По легенде, гостья попросила «что-нибудь, что разбудит и взбодрит». Водка, кофейный ликёр и свежий эспрессо."},
 {t:"b",m:/пенициллин/i,q:"Где появился коктейль «Пенициллин»?",a:"В Нью-Йорке в 2005 году, бар Milk & Honey",o:["В Лондоне во время войны","В аптеке в Глазго","В Сиднее в 1970-е"],why:"Автор — бармен Сэм Росс. Скотч, лимон, мёд и имбирь — согревает «как лекарство», отсюда название."},
 {t:"b",m:/джин тоник/i,q:"Как появился джин-тоник?",a:"Британцы в Индии пили хинин от малярии и добавляли джин, чтобы было вкуснее",o:["Его придумали в лондонском пабе в 1990-е","Его делали голландские моряки из женевера","Его придумали в Нью-Йорке для коктейльных вечеринок"],why:"Хинин — горький, тоник делали с ним как профилактику малярии. Джин, сахар и лайм сделали лекарство приятным."},
 {t:"b",m:/глинтвейн/i,q:"Что означает «глинтвейн» (Glühwein)?",a:"«Пылающее вино» по-немецки",o:["«Вино с пряностями»","«Зимнее вино»","«Сладкое вино»"],why:"Glühen — «пылать, раскаляться». Горячее вино с пряностями — традиция рождественских ярмарок Германии и Австрии."},
 {t:"b",m:/капучино/i,q:"Откуда название «капучино»?",a:"По цвету ряс монахов-капуцинов",o:["От итальянского «шапочка»","От фамилии изобретателя кофемашины","От города Капуя"],why:"Коричнево-бежевый цвет кофе с молоком похож на одежду монахов ордена капуцинов."},
 {t:"b",m:/флэт уайт/i,q:"Где придумали флэт уайт?",a:"В Австралии или Новой Зеландии в 1980-е",o:["В Италии","В Великобритании","В США"],why:"Две страны до сих пор спорят, чей он. Флэт уайт — меньше молока и тоньше пена, чем у латте, вкус кофе ярче."},
 {t:"b",m:/латте/i,q:"Что значит «латте» по-итальянски?",a:"«Молоко»",o:["«Кофе»","«Пенка»","«Сладкий»"],why:"Caffè latte — «кофе с молоком». Если в Италии попросить просто «латте», принесут стакан молока."},
 {t:"b",m:/^раф/i,q:"Откуда взялся кофе «Раф»?",a:"Москва, конец 1990-х — в честь постоянного гостя Рафаэля",o:["Италия, в честь художника Рафаэля","Франция, сокращение от «рафинад»","Турция, старинный рецепт"],why:"Бариста кофейни «Кофе Бин» взбивали эспрессо со сливками и ванильным сахаром для гостя Рафа — напиток так и назвали. Это российское изобретение."},
 {t:"b",m:/матча/i,q:"Что такое матча?",a:"Японский порошковый зелёный чай для чайной церемонии",o:["Китайский улун","Индийская пряная смесь","Перебродивший чай из Кореи"],why:"Чайные кусты для матчи затеняют перед сбором, листья перетирают в порошок — поэтому пьют весь лист целиком, и бодрит она сильнее."},
 {t:"b",m:/эрл грей/i,q:"В честь кого назван «Эрл грей»?",a:"Британского премьер-министра графа Грея",o:["Шотландского чайного торговца","Сорта винограда","Чайного клипера"],why:"Earl Grey — «граф Грей», премьер Великобритании в 1830-е. Аромат даёт масло бергамота."},
 {t:"b",m:/да хун пао/i,q:"Как переводится «Да хун пао»?",a:"«Большой красный халат»",o:["«Колодец дракона»","«Железная богиня»","«Белый пион»"],why:"Знаменитый улун с гор Уишань (Китай). По легенде, кусты укрыли красным халатом в благодарность за исцеление."},
 {t:"b",m:/лун цзин/i,q:"Как переводится «Лун цзин»?",a:"«Колодец дракона»",o:["«Большой красный халат»","«Серебряные иглы»","«Облачный туман»"],why:"Лун цзин — один из самых известных зелёных чаёв Китая, родом из окрестностей Ханчжоу."},
 {t:"b",m:/саган-дайля/i,q:"Саган-дайля — это...",a:"Рододендрон Адамса, горная трава Бурятии и Саян",o:["Сорт монгольского чёрного чая","Ягода с Алтая","Китайский цветочный улун"],why:"Местная трава: по-бурятски «белое крыло». Бодрит, поэтому её не советуют пить на ночь."},
 {t:"b",m:/иван-чай/i,q:"Из какого растения делают иван-чай?",a:"Из кипрея",o:["Из зверобоя","Из мяты","Из чайного куста"],why:"Ферментированный кипрей узколистный. В XIX веке его называли «копорским чаем» — по селу Копорье под Петербургом."},
 {t:"b",m:/ройбуш/i,q:"Откуда родом ройбуш?",a:"Из ЮАР",o:["Из Кении","Из Индии","Из Аргентины"],why:"Ройбуш — «красный куст» на африкаанс. Растёт только в горах Седерберг на юге Африки, кофеина не содержит."},
 {t:"b",m:/guinness/i,q:"Чем знаменит договор основателя Guinness?",a:"Артур Гиннесс арендовал пивоварню в Дублине на 9000 лет",o:["Он продал рецепт за одну бочку пива","Он основал пивоварню в Лондоне в 1950 году","Он запретил продавать пиво в бутылках"],why:"1759 год, пивоварня St. James's Gate в Дублине, аренда на 9000 лет за 45 фунтов в год."},
 {t:"b",m:/ipa/i,q:"Почему IPA так называется?",a:"India Pale Ale — более хмельной эль, который выдерживал путь из Англии в Индию",o:["Его придумали в Индии из риса","Это сокращение от «International Premium Ale»","Его варили только для индийских махараджей"],why:"Хмель и крепость консервировали пиво в долгом плавании. Отсюда яркая хмелевая горечь стиля."},
 {t:"b",m:/tsingtao/i,q:"Почему у китайского Tsingtao немецкие корни?",a:"Пивоварню в Циндао основали немецкие и британские поселенцы в 1903 году",o:["Его рецепт купили у Heineken","Его варят по лицензии в Мюнхене","Его основал немецкий посол в Пекине"],why:"Циндао тогда был немецкой колонией, и варить начали по немецким технологиям. Поэтому Tsingtao — светлый лагер в немецкой традиции."},
 {t:"b",m:/prosecco|просекко/i,q:"Из какого винограда делают просекко?",a:"Из глеры, в Венето и Фриули",o:["Из шардоне в Шампани","Из макабео в Каталонии","Из рислинга в Германии"],why:"Просекко — итальянское игристое из сорта глера. Вторичное брожение идёт в больших резервуарах, поэтому вино лёгкое и фруктовое."},
 {t:"b",m:/cava|кава/i,q:"Кава — это...",a:"Испанское игристое классическим методом, в основном из Каталонии",o:["Итальянское игристое резервуарным методом","Португальское молодое вино","Французский сидр"],why:"Каву делают как шампанское — вторичное брожение в бутылке, — но из местных сортов: макабео, парельяда, шарелло."},
 {t:"b",m:/cremant|креман/i,q:"Чем креман отличается от шампанского?",a:"Его делают тем же классическим методом, но в других регионах Франции",o:["Это игристое из Италии","Его делают из яблок","В нём нет пузырьков"],why:"Шампанским называется только вино из Шампани. Такое же игристое, например из Эльзаса, — Crémant d'Alsace."},
 {t:"b",m:/vinho verde|винью верде/i,q:"Как переводится «винью верде»?",a:"«Зелёное вино» — то есть молодое",o:["«Вино из зелёного винограда»","«Вино с травами»","«Горное вино»"],why:"Vinho Verde — регион на севере Португалии. «Зелёное» — потому что вино пьют молодым: лёгкое, свежее, иногда с лёгкой игристостью."},
 {t:"b",m:/chianti|кьянти/i,q:"Кьянти — вино из какого региона и сорта?",a:"Тоскана, сорт санджовезе",o:["Пьемонт, неббиоло","Сицилия, неро д'авола","Венето, корвина"],why:"Chianti — тосканский регион между Флоренцией и Сиеной. Основной сорт — санджовезе."},
 {t:"b",m:/саперави/i,q:"Что означает «саперави»?",a:"«Дающий цвет» — у этого сорта окрашена даже мякоть",o:["«Солнечный»","«Старая лоза»","«Горный»"],why:"Грузинский сорт-красильщик: сок у него сразу тёмный. Вина получаются плотными и насыщенными."},
 {t:"b",m:/espolon|cuervo|текил/i,q:"Из чего делают текилу?",a:"Из голубой агавы, в основном в штате Халиско",o:["Из кактуса опунции","Из сахарного тростника","Из кукурузы"],why:"Агава — не кактус. Текилу по закону делают только в Мексике, главным образом в штате Халиско, из голубой агавы Вебера."},
 {t:"b",m:/vsop/i,q:"Что означает VSOP на коньяке?",a:"Very Superior Old Pale — коньячным спиртам минимум 4 года",o:["Very Special Old Product — 10 лет","Винтаж определённого года","Коньяк без выдержки"],why:"VS — минимум 2 года выдержки в дубе, VSOP — минимум 4, XO — от 10 лет."},
 {t:"b",m:/martini|вермут/i,q:"Где и когда появился вермут в нынешнем виде?",a:"В Турине в 1786 году, Антонио Бенедетто Карпано",o:["В Париже в 1920-е","В Лондоне в 1850-е","В Мадриде в 1700 году"],why:"Вермут — вино с травами. Название от немецкого Wermut — «полынь», главная горчинка в составе."},
 {t:"b",m:/jack daniel/i,q:"Чем Jack Daniel's отличается от бурбона?",a:"Его фильтруют через уголь сахарного клёна — это теннессийский виски",o:["Его выдерживают в бочках из-под хереса","Его делают из ячменя без кукурузы","Его разбавляют колой на заводе"],why:"«Линкольнский процесс»: перед выдержкой спирт медленно проходит через толщу кленового угля и становится мягче."},
 {t:"b",m:/takamaka/i,q:"Откуда ром Takamaka?",a:"С Сейшельских островов",o:["С Ямайки","С Кубы","С Филиппин"],why:"Takamaka — ром с Сейшел, назван в честь местного дерева и бухты."},
 {t:"b",m:/roku/i,q:"Что означает название японского джина Roku?",a:"«Шесть» — в нём шесть японских ботаников",o:["«Дракон»","«Остров»","«Цветок сакуры»"],why:"Roku — шесть по-японски: сакура (цветы и листья), чай сенча и гёкуро, перец сансё и юдзу. Бутылка тоже шестигранная."},

/* --- GitHub API --- */
async function gh(method, path, body){
  const r = await fetch(`https://api.github.com/repos/${A.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`, {
    method, headers: { "Authorization": "Bearer " + A.token, "Accept": "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if(r.status===404 && method==="GET") return null;
  if(!r.ok){ const e = new Error("GitHub " + r.status); e.status = r.status; try { e.detail = (await r.json()).message; } catch(x){} throw e; }
  return r.json();
}
function b64utf8(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin);
}
function fromB64utf8(b64){
  const bin = atob(b64.replace(/\s/g,"")); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghError(e){
  if(e.status===401) return "Токен не подходит или истёк. Создайте новый на GitHub.";
  if(e.status===403) return "У токена нет права на запись в этот репозиторий. Добавьте PodushkaHelper в настройки токена.";
  if(e.status===404) return "Репозиторий не найден. Проверьте название: владелец/репозиторий.";
  if(e.status===409 || e.status===422) return "Данные изменились с другого устройства. Выйдите и войдите снова, затем повторите правку.";
  if(!e.status) return "Нет связи с GitHub. Проверьте интернет и повторите.";
  return "GitHub ответил ошибкой " + e.status + (e.detail ? ": " + e.detail : "");
}
async function login(token, repo){

  if(!r.ok){ const e = new Error(); e.status = r.status; throw e; }
  const info = await r.json();
  if(info.permissions && !info.permissions.push){ const e = new Error(); e.status = 403; throw e; }
  const f = await gh("GET", "content.json");          // свежая версия прямо из репозитория
  if(f){ A.sha = f.sha; try { setDB(JSON.parse(fromB64utf8(f.content))); } catch(x){} }
  else A.sha = null;
  A.on = true; A.dirty = false; A.pending = {}; A.snapshot = dbJSON();
  savedToken = token; store.set(TK, token); store.set(RK, repo);
  document.body.classList.add("admin");
  updateBar(); rerender();
}
function logout(force){
  if(A.dirty && !force){ confirmSheet("Есть несохранённые правки", "Если выйти сейчас, они пропадут.", "Выйти без сохранения", ()=>logout(true)); return; }
  if(A.dirty){ A.dirty=false; A.pending={}; try { setDB(JSON.parse(A.snapshot)); } catch(e){} }
  A.on=false; document.body.classList.remove("admin"); updateBar(); rerender();
}
function forget(){ savedToken=""; store.del(TK); store.del(RK); }
function markDirty(){ A.dirty = true; buildPools(); rebuildDrinkLoc(); updateBar(); try { tg && tg.enableClosingConfirmation(); } catch(e){} }
function updateBar(){
  const bar = document.getElementById("abar"); bar.hidden = !A.on;
  const n = Object.keys(A.pending).length;
  document.getElementById("ab-t").textContent = A.saving ? "Сохраняю…" : A.dirty ? `Есть несохранённые правки${n?` · фото: ${n}`:""}` : "Режим редактирования · всё сохранено";
  document.getElementById("ab-save").disabled = !A.dirty || A.saving;
  if(!A.dirty) try { tg && tg.disableClosingConfirmation(); } catch(e){}
}
window.addEventListener("beforeunload", e=>{ if(A.dirty){ e.preventDefault(); e.returnValue=""; } });
async function save(){
  if(A.saving || !A.dirty) return;
  A.saving = true; updateBar();
  try {
    const json = dbJSON();
    for(const [path, b64] of Object.entries(A.pending)){
      if(json.includes(path)) await gh("PUT", path, { message: "Фото " + path, content: b64 });
      delete A.pending[path];
    }
    const body = { message: "Правки из шпаргалки" + (tgUser ? " — " + (tgUser.first_name||"") : ""), content: b64utf8(json) };
    if(A.sha) body.sha = A.sha;
    const r = await gh("PUT", "content.json", body);
    A.sha = r.content.sha; A.dirty = false; A.snapshot = json;
    toast("Сохранено. У сотрудников обновится через 1–2 минуты.", 4000);
  } catch(e){ toast(ghError(e), 6000); }
  A.saving = false; updateBar();
}

/* --- Фото: сжатие на телефоне перед загрузкой --- */
function readImage(file, max){
  max = max || 1280;
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL("image/jpeg", 0.82);
      res({ dataUrl, b64: dataUrl.split(",")[1] });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Не удалось открыть фото. Попробуйте JPG или PNG.")); };
    img.src = url;
  });
}
function addPending(photo, hint){
  const tr = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ы:"y",э:"e",ю:"yu",я:"ya"};
  const slug = (hint||"").toLowerCase().replace(/[а-яё]/g,c=>tr[c]||"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30);
  const path = "img/" + (slug ? slug + "-" : "") + Date.now().toString(36) + ".jpg";
  A.pending[path] = photo.b64; shown[path] = photo.dataUrl; return path;
}
function photoField(cur){
  return `<div class="photo-pick" data-photo>
    <img src="${cur?esc(src(cur)):""}" alt="" ${cur?"":"hidden"}>
    <div class="pp-btns"><label>📷 ${cur?"Заменить фото":"Выбрать фото"}<input type="file" accept="image/*"></label>${cur?`<button type="button" data-rm-photo>Убрать фото</button>`:""}</div>
    <p class="err" hidden></p></div>`;
}
function wirePhoto(root, state){
  const box = root.querySelector("[data-photo]"); if(!box) return;
  const img = box.querySelector("img"), err = box.querySelector(".err");
  box.querySelector("input[type=file]").addEventListener("change", async ev=>{
    const f = ev.target.files[0]; if(!f) return;
    err.hidden = true;
    try { state.photo = await readImage(f); state.removed = false; img.src = state.photo.dataUrl; img.hidden = false; }
    catch(e){ err.textContent = e.message; err.hidden = false; }
  });
  const rm = box.querySelector("[data-rm-photo]");
  if(rm) rm.addEventListener("click", ()=>{ state.photo = null; state.removed = true; img.hidden = true; });
}
function applyPhoto(state, current, hint){
  if(state.photo) return addPending(state.photo, hint);
  if(state.removed) return "";
  return current || "";
}

/* --- Окно редактирования --- */
function openSheet({ title, body, saveText, onSave, onDelete, deleteText, onOpen }){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <h3>${esc(title)}</h3>${body}
    <p class="err" data-err hidden></p>
    <div class="row">${onDelete?`<button type="button" class="btn-del" data-del>${esc(deleteText||"Удалить")}</button>`:""}<button type="button" class="btn-ghost" data-cancel>Отмена</button><button type="submit" class="btn-main">${esc(saveText||"Готово")}</button></div>
  </form>`;
  document.body.appendChild(bg);
  const form = bg.querySelector("form"), errEl = form.querySelector("[data-err]");
  const close = () => bg.remove();
  const fail = msg => { errEl.textContent = msg; errEl.hidden = false; };
  const opened = Date.now();
  bg.addEventListener("click", e=>{ if(e.target===bg && Date.now()-opened > 500) close(); });  // не закрывать от того же касания, которым открыли
  form.querySelector("[data-cancel]").addEventListener("click", close);
  const del = form.querySelector("[data-del]");
  if(del) del.addEventListener("click", ()=>{
    if(!del.classList.contains("sure")){ del.classList.add("sure"); del.textContent = "Точно удалить?"; return; }
    onDelete(); close();
  });
  form.addEventListener("submit", async e=>{
    e.preventDefault(); errEl.hidden = true;
    const btn = form.querySelector(".btn-main"); btn.disabled = true;
    try { const r = await onSave(form, fail); if(r !== false) close(); }
    finally { btn.disabled = false; }
  });
  if(onOpen) onOpen(form);
  return form;
}

// --- «рассказ для гостя»: угадай позицию по описанию (название в тексте скрыто)
const STOPW_L = new Set(["с","и","в","на","из","по","для","от"]);
const cutText = (t, max) => { t = String(t||"").replace(/\s+/g," ").trim(); if(t.length <= max) return t; const c = t.slice(0, max); const k = Math.max(c.lastIndexOf(". "), c.lastIndexOf("! ")); return (k > 80 ? c.slice(0, k+1) : c.replace(/\s+\S*$/,"") + "…"); };
function maskName(text, name){
  let t = text; const words = String(name).replace(/[«»"()]/g," ").split(/[\s\-–—,/]+/).filter(w=>w.length >= 4 && !STOPW_L.has(w.toLowerCase()));
  words.forEach(w=>{ const stem = w.length > 5 ? w.slice(0, w.length - 2) : w; t = t.replace(new RegExp(stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "[а-яёa-z]*", "gi"), "…"); });
  return t.replace(/(…)([\s,.\-–—]*…)+/g, "…");
}
function storyPool(){
  const out = [];
  KF.forEach(it=>{ if(it.desc && it.desc.length >= 60) out.push({ name: it.name, text: cutText(it.desc, 240), group: "k" }); });
  BF.forEach(x=>{ if(x.s.id==="spirits") return; const l = (x.it.long||[]).find(f=>f[0]==="Описание") || (x.it.long||[]).find(f=>f[0]==="Интересная информация");
    if(l && String(l[1]).length >= 60) out.push({ name: x.it.name, text: cutText(l[1], 240), group: "b:" + x.s.id }); });
  return out.map(x=>({ ...x, text: maskName(x.text, x.name) })).filter(x=>x.text.split("…").length < 5);
}
let STORY = null;
GEN.story = [()=>{ STORY = STORY || storyPool(); if(STORY.length < 4) return null;
  const x = pick(STORY); const d = distract(x.name, STORY.filter(y=>y.group===x.group && y.name!==x.name).map(y=>y.name));
  return d && { q: "О какой позиции этот рассказ для гостя?", sub: x.text, a: x.name, o: d, why: `Это «${x.name}».`, topic: "story" }; }];

// --- набор вопросов из нескольких тем
function makeQuiz(topics, n){
  topics = topics && topics.length ? topics : LTOPICS.map(t=>t[0]);
  const share = { kitchen: .4, bar: .3, story: .15, hist: .15 }, act = topics.filter(t=>GEN[t] && GEN[t].length);
  const tot = act.reduce((k,t)=>k+share[t],0) || 1;
  const recent = new Set(LS.get("pd_recent", []));
  const qs = [], seen = new Set();
  const take = (t, want)=>{ let got = 0, guard = 0;
    while(got < want && guard++ < want*80){ const q = pick(GEN[t])(); if(!q) continue;
      const key = q.q + "|" + (q.sub||""); if(seen.has(key)) continue;
      if(recent.has(key) && guard < want*40) continue;
      const opts = shuffle([q.a, ...q.o]); if(new Set(opts).size !== opts.length) continue;
      seen.add(key); qs.push({ ...q, opts, topic: q.topic || t }); got++; }
    return got; };
  act.forEach(t=>take(t, Math.round(n*share[t]/tot)));
  for(const t of shuffle(act)){ if(qs.length >= n) break; take(t, n - qs.length); }
  LS.set("pd_recent", [...qs.map(q=>q.q + "|" + (q.sub||"")), ...recent].slice(0, 200));
  return shuffle(qs).slice(0, n);
}

function examBank(){
  const bank = { kitchen: [], bar: [], story: [], hist: [] };
  // Варианты берём из однотипных полей карточек, предпочтительно из той же категории.
  function add(topic, q, answer, local, fallback, why){
    const a = String(answer || "").replace(/\s+/g, " ").trim();
    if(!a || a.length > 240 || /^(?:нет|не указан[оы]?|—|-)\.?$/i.test(a)) return;
    const clean = values => values.map(v => String(v || "").replace(/\s+/g, " ").trim())
      .filter(v => v && v.length <= 240 && !/^(?:нет|не указан[оы]?|—|-)\.?$/i.test(v));
    const o = distract(a, clean(local)) || distract(a, clean(fallback));
    if(o) bank[topic].push({ q, a, o, why: why || a, topic });
  }

  for(const g of K){
    for(const it of g.items){
      const name = `«${it.name}»`;
      const comp = x => (x.comp || []).slice(0, 2).join(" · ");
      add("kitchen", `Какие компоненты входят в блюдо ${name} по карточке меню?`,
        comp(it), g.items.map(comp), KF.map(comp));
      add("kitchen", `Какие основные аллергены указаны в карточке блюда ${name}?`,
        it.allerg, g.items.map(x => x.allerg), KF.map(x => x.allerg),
        `В карточке указано: ${it.allerg}. При сообщении об аллергии уточните полный состав и риск контакта с аллергеном на кухне.`);
      add("story", `Гость хочет дополнить блюдо ${name}. Какой набор допов указан в меню?`,
        it.dops, g.items.map(x => x.dops), KF.map(x => x.dops));
    }
  }

  for(const {s, g, it} of BF){
    const section = BF.filter(x => x.s === s).map(x => x.it);
    const name = `«${it.name}»`;
    const fields = [
      [`Что входит в напиток ${name} по карточке меню?`, x => longF(x, "Состав")],
      [`Какой стиль указан для напитка ${name}?`, x => chip(x, "Стиль")],
      [`Какие сорта винограда указаны для вина ${name}?`, x => longF(x, "Сортовой состав")]
    ];
    for(const [q, read] of fields){
      add("bar", q, read(it), g.items.map(read), section.map(read));
    }
    const taste = x => (x.tags || []).join(", ");
    add("story", `Гость спрашивает, какой вкус у напитка ${name}. Как его описывает карточка меню?`,
      taste(it), g.items.map(taste), section.map(taste));
  }

  bank.story.unshift(...EXAM_SERVICE.map(([q, a, ...o]) => ({ q, a, o, why: a, topic: "story" })));
  const menuNames = [...KF.map(x => x.name), ...BF.map(x => x.it.name + " " + (x.it.alt || ""))];
  bank.hist = HISTORY.filter(h => menuNames.some(name => h.m.test(name)))
    .map(({q, a, o, why}) => ({ q, a, o, why, topic: "hist" }));
  return bank;
}

function makeExam(ex){
  const bank = examBank();
  const recent = new Set(LS.get("pw_exam_recent", []));
  const topics = examTopics(ex).map(([id, , weight]) => {
    const seen = new Set();
    const pool = shuffle(bank[id]).filter(({q}) => {
      if(seen.has(q)) return false;
      seen.add(q);
      return true;
    });
    // Сначала предлагаем практическую ситуацию, которой ещё не было в недавних попытках.
    const priority = question => EXAM_SERVICE.some(([q]) => q === question.q);
    if(id === "story"){
      const first = pool.findIndex(question => priority(question) && !recent.has(question.q));
      if(first >= 0) pool.unshift(...pool.splice(first, 1));
    }
    pool.sort((a,b) => Number(recent.has(a.q)) - Number(recent.has(b.q)));
    return { pool, weight, used: 0 };
  });
  const qs = [];
  while(qs.length < (ex.n || 40)){
    const next = topics.filter(t => t.used < t.pool.length)
      .sort((a,b) => (a.used + 1) / a.weight - (b.used + 1) / b.weight)[0];
    if(!next) break;
    const q = next.pool[next.used++];
    qs.push({ ...q, opts: shuffle([q.a, ...q.o]) });
  }
  LS.set("pw_exam_recent", [...new Set([...qs.map(q => q.q), ...recent])].slice(0, 200));
  return shuffle(qs);
}

  return out;
}

    <div class="lcard">
      ${it.img?`<img class="lc-img${/bottle-/.test(it.img)?" fit":""}" src="${esc(src(it.img))}" alt="">`:""}
      <span class="eyebrow">${esc(x.group)}${lvl>=2?" · выучено":""}</span>
      <h2>${esc(it.name)}</h2>
      ${LC.open ? back || `<p class="lc-q">В шпаргалке пока нет подробностей по этой позиции.</p>` : `<p class="lc-q">${ask}, потом проверьте себя.</p>`}
    </div>
    <div class="lbtns">${LC.open
      ? `<button type="button" class="lb bad" data-lcard="0">Не вспомнил</button><button type="button" class="lb ok" data-lcard="1">Помню</button>`
      : `<button type="button" class="lb main" data-lcard="show">Показать ответ</button>`}</div>`;
}
function cardAnswer(v){
  if(v==="show"){ LC.open = true; return learnCards(); }
  const known = LS.get("pw_known", {}), k = cardKey(LC.order[LC.i]);
  known[k] = v==="1" ? Math.min(5, (known[k]||0) + 1) : 0; LS.set("pw_known", known);
  if(v==="0") LC.order.push(LC.order[LC.i]);
  LC.i++; LC.open = false; learnCards(); window.scrollTo(0,0);
}

  <h2 class="qz-q" id="qz-title" tabindex="-1">${esc(q.q)}</h2>${q.sub?`<p class="lsub">${esc(q.sub)}</p>`:""}
  </section>
  <div class="qz-opts">${q.opts.map((o,i)=>`<button type="button" class="qz-o" data-ans="${i}"><span class="qz-key" aria-hidden="true">${"АБВГ"[i]||i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <div id="qzfb"></div>`;
  window.scrollTo(0,0);
  document.getElementById("qz-title").focus({preventScroll:true});
}
function answer(i){
  if(QZ.answered) return; QZ.answered = true;
  const q = QZ.qs[QZ.i], ok = q.opts[i]===q.a;
  QZ.picks[QZ.i] = q.opts[i];
  if(ok) QZ.score++; else QZ.wrong.push({ q, p: q.opts[i] });
  if(QZ.kind==="exam"){ haptic(); return nextQ(); }
  try{ tg && tg.HapticFeedback.notificationOccurred(ok?"success":"error"); }catch(e){}
  document.querySelectorAll(".qz-o").forEach((b,j)=>{ b.disabled=true; if(q.opts[j]===q.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  const last = QZ.i===QZ.qs.length-1;
  document.getElementById("qzfb").innerHTML = `<div class="qz-fb ${ok?"ok":"no"}"><b>${ok?"Верно!":"Не совсем."}</b><p>${esc(q.why)}</p></div>
    <button type="button" class="qz-next" data-next>${last?"Посмотреть результат":"Дальше →"}</button>`;
  document.querySelector("[data-next]").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function nextQ(){ if(QZ.i < QZ.qs.length-1){ QZ.i++; showQ(); } else resultQ(); }
function resultQ(){
  const exam = QZ.kind==="exam", ex = EXAMW(), n = QZ.qs.length, score = QZ.score, p = pct(score, n);
  const passed = p >= (exam ? (ex.pass||80) : 80);
  if(!QZ.saved){
    QZ.saved = true; QZ.result = { date: nowStr(), pct: p, score, total: n, passed };
    if(exam) LS.set("pw_exam_last", QZ.result);
    else { const b = LS.get("pw_best", null); if(!b || p >= b.pct) LS.set("pw_best", { pct: p, date: QZ.result.date }); }
    try{ tg && tg.HapticFeedback.notificationOccurred(p>=50?"success":"error"); }catch(e){}
    sendToRating();
  }
  const verdict = exam ? (passed ? "Аттестация сдана!" : `Не сдана — нужно ${ex.pass||80}%. Повторите меню и попробуйте снова.`)
    : p>=90?"Отлично, готов к аттестации!":p>=70?"Хорошо, но есть что повторить.":p>=50?"Неплохо — загляни в разбор ошибок.":"Стоит ещё раз пройтись по меню.";
  const st = QZ.sendState;
  topbar(exam ? "Аттестация" : "Тест"); setNav("quiz");
  $view.innerHTML = `<div class="sp-head"><span class="eyebrow">${exam ? "Аттестация" : "Тест"}</span><h1>${score} из ${n} · ${p}%</h1><p>${verdict}</p>
      ${st && st!=="off" ? `<p class="lsend">${st==="ok" ? (exam ? "Результат в рейтинге ✓" : `+${score} ${plural(score,"очко","очка","очков")} в рейтинг тренировок ✓`) : st==="err" ? "Не удалось отправить в рейтинг." : "Отправляем в рейтинг…"}</p>${st==="err"?`<button type="button" class="lt-link" data-lresend>Отправить ещё раз</button>`:""}` : ""}</div>
    ${memeHTML(n===10 ? score : Math.round(p/10), 10)}
    <div class="lbtns"><button type="button" class="lb" data-go="quiz">К прогрессу${ex.url ? " и рейтингу" : ""}</button><button type="button" class="lb main" data-lagain="${QZ.kind}">${exam ? "Пройти заново" : "Новый тест"}</button></div>
    <button type="button" class="qbtn" data-send style="margin-top:10px;width:100%"><b>Отправить результат управляющему</b><span>Сообщением в Telegram</span></button>
    ${QZ.wrong.length ? `<div class="sec-label eyebrow">Ошибки · ${QZ.wrong.length}</div>
      <div class="lwrong">${QZ.wrong.map(w=>`<div class="lw"><b>${esc(w.q.q)}</b>${w.q.sub?`<small>${esc(w.q.sub)}</small>`:""}<span class="bad">Ваш ответ: ${esc(w.p||"—")}</span><span class="ok">Верно: ${esc(w.q.a)}</span></div>`).join("")}</div>` : ""}`;
  window.scrollTo(0,0);
}
function sendResult(){
  const name = QZ.name || staffName() || "Без имени";
  const text = `📝 ${QZ.kind==="exam" ? "Аттестация" : "Тест"} «Подушки»\n${name}\nРезультат: ${QZ.score} из ${QZ.qs.length} (${pct(QZ.score, QZ.qs.length)}%)${QZ.kind==="exam" ? (QZ.result && QZ.result.passed ? " — сдана" : " — не сдана") : ""}\n${nowStr()}` + (QZ.wrong.length?`\n\nОшибки:\n${QZ.wrong.slice(0,20).map(w=>"• "+w.q.q).join("\n")}`:"");
  const url = `https://t.me/share/url?url=${encodeURIComponent(location.origin+location.pathname)}&text=${encodeURIComponent(text)}`;
  try{ if(tg && tg.openTelegramLink){ tg.openTelegramLink(url); return; } }catch(e){}
  window.open(url, "_blank");
}

// --- аттестация: имя
function staffName(){
  if(!tgUser) return LS.get("pw_name", "");
  const s = STAFF.find(x=>x.id===tgUser.id);
  return (s && s.name) || [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ");
}
function examStart(){
  topbar("Аттестация"); setNav("quiz");
  const ex = EXAMW(), tps = examTopics(ex);
  const bank = examBank();
  const available = new Set(tps.flatMap(([id]) => bank[id].map(({q}) => q))).size;
  const count = Math.min(ex.n||40, available);
  const locked = tgUser && STAFF.some(x=>x.id===tgUser.id && x.name);
  $view.innerHTML = `<section class="sp-head exam-head"><h1>Аттестация</h1>
      <dl class="exam-facts"><div><dt>${plural(count,"вопрос","вопроса","вопросов")}</dt><dd>${count}</dd></div><div><dt>проходной балл</dt><dd>${ex.pass||80}%</dd></div></dl>
      <p>${esc(tps.map(t=>t[1]).join(" · "))}</p>
      <p>Правильные ответы появятся после завершения.${ex.url ? " Лучший результат попадёт в рейтинг." : ""}</p></section>
    <div class="lcard">
      <label class="lname">Ваше имя<input id="lname" value="${esc(staffName())}" placeholder="Имя и фамилия" autocomplete="name"${locked ? " readonly" : ""}></label>
      <button type="button" class="lb main" data-lexam>Начать аттестацию</button>
    </div>`;
}

// --- рейтинг: общий для всех, хранится в Google-скрипте
function post(payload){
  return fetch(EXAMW().url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
}
function sendToRating(){
  if(!EXAMW().url){ QZ.sendState = "off"; return; }
  const r = QZ.result;
  QZ.payload = { action: "result", kind: QZ.kind, name: QZ.name || staffName() || "Без имени", id: tgUser ? tgUser.id : "", score: r.score, total: r.total, pct: r.pct, passed: r.passed, initData: (tg && tg.initData) || "" };
  QZ.sendState = "wait";
  const me = QZ;
  post(QZ.payload).then(()=>{ me.sendState = "ok"; TOP = null; }).catch(()=>{ me.sendState = "err"; })
    .then(()=>{ if(QZ === me && /^#quiz-(exam|test|big)$/.test(location.hash)) resultQ(); });
}
let TOP = null, topAt = 0, topTab = "exam";
function loadTop(){
  if(TOP && Date.now() - topAt < 60000) return Promise.resolve(TOP);
  return fetch(EXAMW().url + "?action=top&t=" + Date.now()).then(r=>r.json()).then(d=>{ TOP = d; topAt = Date.now(); return d; }).catch(()=>null);
}
function topHtml(t){
  if(!t) return `<p class="lnote">Не удалось загрузить рейтинг. Проверьте интернет.</p>`;
  const me = tgUser ? String(tgUser.id) : "", list = topTab === "exam" ? (t.exam||[]) : (t.train||[]);
  const medal = i => i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : String(i+1);
  return `<div class="ltabs"><button class="tab" type="button" data-ltop="exam" aria-selected="${topTab==="exam"}">Аттестация · лучший %</button><button class="tab" type="button" data-ltop="train" aria-selected="${topTab==="train"}">Тренировки · ${esc(t.month||"месяц")}</button></div>
    ${list.length ? `<ol class="ltlist">${list.map((x,i)=>`<li class="${String(x.id)===me?"me":""}"><span class="lpl">${medal(i)}</span><span class="lnm">${esc(x.name)}${topTab==="exam"&&x.attempts>1?`<small>${x.attempts} ${plural(x.attempts,"попытка","попытки","попыток")}</small>`:""}</span><b>${topTab==="exam" ? x.pct + "%" : x.points}</b></li>`).join("")}</ol>`
    : `<p class="lnote">${topTab==="exam" ? "Пока никто не прошёл аттестацию. Будьте первым!" : "В этом месяце ещё никто не тренировался."}</p>`}
    <p class="lnote">${topTab==="exam" ? "Считается лучший результат каждого." : "Очки — верные ответы в тестах. Обнуляются 1-го числа."}</p>`;
}

// --- клики обучения
document.addEventListener("click", e=>{
  const el = e.target.closest("button"); if(!el) return;
  if(el.dataset.ltopic !== undefined){ haptic(); let t = learnTopics(); const id = el.dataset.ltopic; t = t.includes(id) ? t.filter(x=>x!==id) : [...t, id]; if(!t.length) return toast("Оставьте хотя бы одну тему"); LS.set("pw_topics", t); LC = null; quiz(); return; }
  if(el.dataset.lcard !== undefined){ haptic(); cardAnswer(el.dataset.lcard); return; }
  if(el.dataset.lagain !== undefined){ haptic(); if(el.dataset.lagain==="exam"){ QZ = null; examStart(); } else startTest(QZ && QZ.qs.length > 10 ? 75 : 10); return; }
  if(el.dataset.ltop !== undefined){ haptic(); topTab = el.dataset.ltop; const box = document.getElementById("ltop"); if(box && TOP) box.innerHTML = topHtml(TOP); return; }
  if(el.dataset.lresend !== undefined){ haptic(); QZ.sendState = "wait"; resultQ(); post(QZ.payload).then(()=>{ QZ.sendState = "ok"; }).catch(()=>{ QZ.sendState = "err"; }).then(()=>resultQ()); return; }
  if(el.dataset.lexam !== undefined){
    const inp = document.getElementById("lname"), name = inp ? inp.value.trim() : "";
    if(!name){ toast("Напишите имя"); inp && inp.focus(); return; }
    if(!tgUser) LS.set("pw_name", name);
    haptic(); startExam(name); return;
  }
});
function learnRoute(b){
  if(b==="cards") return learnCards();
  if(b==="test"){ if(!QZ || QZ.kind!=="test" || QZ.qs.length!==10 || QZ.done) startTest(10); else (QZ.saved ? resultQ() : showQ()); return; }
  if(b==="big"){ if(!QZ || QZ.kind!=="test" || QZ.qs.length<=10) startTest(75); else (QZ.saved ? resultQ() : showQ()); return; }
  if(b==="exam"){ if(QZ && QZ.kind==="exam") return QZ.saved ? resultQ() : showQ(); return examStart(); }
  quiz();
}

/* ---------- Доступ только по списку ---------- */
let booted = false;
function allowed(){
  if(!ACCESS.on) return true;
  if(A.on || savedToken) return true;
  return !!(tgUser && (ADMINS.includes(tgUser.id) || STAFF.some(s=>s.id===tgUser.id)));
}
function lockScreen(){
  document.body.classList.add("locked");
  $top.innerHTML = `<button type="button" class="logo-tap" aria-label="Подушка"><img class="top-word" src="${WORD}" alt="Подушка" draggable="false"></button>`;
  if (tg) { try { tg.BackButton.hide(); } catch(e){} }
  const name = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") : "";
  $view.innerHTML = `<section class="lock"><img class="lock-cat" src="${CAT}" alt="">
    <h1>Нет доступа</h1>
    ${tgUser ? `<p>Шпаргалка открыта только для команды «Подушки». Отправьте управляющему свой Telegram ID — после того как вас добавят, просто откройте шпаргалку снова.</p>
      <div class="lock-id"><span>${esc(name)}</span><b>${tgUser.id}</b></div>
      <button class="lb main" type="button" data-copyid="${tgUser.id}">Скопировать ID</button>`
    : `<p>Откройте шпаргалку через Telegram-бота «Подушки».</p>`}</section>`;
}
document.addEventListener("click", e=>{ const b = e.target.closest("[data-copyid]"); if(!b) return;
  const id = b.dataset.copyid; (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject()).then(()=>toast("ID скопирован"), ()=>toast("ID: " + id)); });

function rerender(){ if(!booted) return; if(!allowed()){ lockScreen(); return; } const y = window.scrollY; routeInner(); window.scrollTo(0, y); applyStop(); }
async function reloadContent(){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 4500);
  try{
    const response = await fetch("content.json", {cache:"no-cache", signal:controller.signal});
    if(!response.ok) throw new Error("Не удалось загрузить меню");
    const data = await response.json();
    if(data && data.kitchen && !A.on) setDB(data);
  }catch(e){
    try{ if(localStorage.getItem("pw_acc_on")==="1") ACCESS.on = true; }catch(e){}
  }finally{
    clearTimeout(timeout);
  }
  loadStop();
  booted = true;
  route();
}
reloadContent();
})();
</script>
</body></html>
